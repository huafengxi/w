<html>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <head>
    <title>console</title>
    <base target="_blank">
    <link rel="stylesheet" type="text/css" href="/w/view/my.css"/>
    <script src="/w/view/my.js"></script>
    <script src="/w/view/editor.js"></script>
    <script src="/w/ext/markdown/deps/marked.min.js"></script>
    <script src="/w/view/anchor-widgets.js" defer></script>
    <style>#doc li > p { margin: 0.2em 0; }</style>
    <script type="application/javascript">
      // The view supplies deployment context; the widget library knows neither
      // Markdown nor the server's template injection/proxy routing conventions.
      var cmdSource = (function () {
        try {
          var args = $ARGS_JSON;
          if (args && typeof args.src === 'string' && args.src) return args.src;
        } catch (e) {}
        return window.location.pathname;
      })();
      var cmdPrefix = (function () {
        var p = window.location.pathname, s = cmdSource;
        return p.length > s.length && p.slice(-s.length) === s ? p.slice(0, -s.length) : '';
      })();
      function toggle_editor() { toggleVisible($('editor')); }
      function getTitle(content) {
        var m = content.match(/^# (.*)/m);
        return m ? m[1] : 'untitle';
      }
      function underscore_escape_filter(content) {
        // Preserve code and raw HTML tags (including href attributes).
        return content.replace(/((?:^|\n)```[\s\S]*?\n```|`[^`\n]*`|<[^>]*>)|_/g,
          function(m, literal) { return literal ? literal : '\\_'; });
      }
      function renderMarkdown(text) {
        var html = window.marked.parse(underscore_escape_filter(text));
        return html.replace(/<li>\s*<p>/g, '<li>').replace(/<\/p>\s*<\/li>/g, '</li>');
      }
      function updateWidgetButtons(widgets) {
        var automatic = widgets.some(function(w) {
          return !w.manual && !w.anchor.closest('[data-anchor-output]');
        });
        $('run-all').style.display = $('refresh-all').style.display = automatic ? 'inline' : 'none';
      }
      function renderDoc(content) {
        setWindowTitle(getTitle(content));
        $('doc').innerHTML = renderMarkdown(content);
        AnchorWidgets.enhance($('doc'));
        updateWidgetButtons(AnchorWidgets.getWidgets());
      }
      function runAll() { return AnchorWidgets.runAll(); }
      var lastRendered = null;
      function initApp() {
        if (inIframe()) hide($('head-bar'));
        AnchorWidgets.configure({
          source: cmdSource,
          shellEndpoint: cmdPrefix + '/w/ext/shell/rpc/sh.py',
          autoRun: new URLSearchParams(window.location.search).get('_v') === 'autorun',
          renderOutput: function(node, text) { node.innerHTML = renderMarkdown(text); },
          onChange: updateWidgetButtons
        });
        makeEditor($('editor'), function(content) { lastRendered = content; renderDoc(content); });
      }
    </script>
  </head>
  <body onload="initApp()">
    <nav id="head-bar"><a href="#" onclick="toggle_editor(); return false;">edit</a><a id="run-all" href="#" onclick="runAll(); return false;" style="display:none">run-all</a><a id="refresh-all" href="#" onclick="runAll(); return false;" style="display:none">refresh-all</a><hr/></nav>
    <div id="editor"></div>
    <div id="doc" class="doc"></div>
  </body>
</html>

<html>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <head>
    <title>console</title>
    <base target="_blank">
    <link rel="stylesheet" type="text/css" href="/w/view/my.css"/>
    <script type="application/javascript" src="/w/view/my.js"></script>
    <script type="application/javascript" src="/w/view/editor.js"></script>
    <script type="application/javascript" src="/w/ext/markdown/deps/marked.min.js"></script>
    <style>
      #doc li > p { margin: 0.2em 0; }
      .iframe-preview { margin: 0.4em 0 0.8em; }
      /* height is set to content height by autoFitPreview(); the small 4em is only
         the pre-load placeholder. max-height caps absurdly long docs — the iframe
         then scrolls internally instead of stretching the page. */
      .iframe-preview iframe { display: block; height: 4em; max-height: 80vh; }
    </style>
    <script type="application/javascript">
      function toggle_editor() { toggleVisible($('editor')); }
      function dirname(path) { return path.match(/.*\//);  }
      function getTitle(content) {
         var m = content.match(/^# (.*)/m);
         if (m) return m[1];
         return "untitle";
      }
      function underscore_escape_filter(content) {
         return content.replace(/((?:^|\n)```[\s\S]*?\n```|`[^`\n]*`)|_/g, function(m, code){ return code ? code : '\\_'; });
      }
      function renderMarkdown(text) {
         // marked (GFM: tables, nested lists); then force tight lists by
         // stripping paragraph wrappers from list items (loose lists add
         // unwanted vertical spacing).
         var html = window.marked.parse(underscore_escape_filter(text));
         return html.replace(/<li>\s*<p>/g, '<li>').replace(/<\/p>\s*<\/li>/g, '</li>');
      }
      function getInterp(content) {
         var m = content.match(/^#!cmd-interp (.*)$/m);
         return m ? m[1].trim() : '/w/ext/shell/rpc/sh.py';
      }
      // Build an inline-command widget: a run button, a hideable stderr log
      // console, and a stdout result rendered as markdown. #!cmd-interp names
      // the rpc endpoint (default sh.py, dispatched via i=ido_report_cmd),
      // which streams output line-framed with a leading tag byte
      // ('1'=stdout, '2'=stderr).
      function buildCmdWidget(w, interp) {
         var ph = $(w.id);
         if (!ph) return null;
         var box = $n('div');
         var btn = $n('button'); btn.textContent = 'run: ' + w.cmd;
         var refreshBtn = $n('button'); refreshBtn.textContent = 'refresh';
         var logBtn = $n('button'); logBtn.textContent = 'log';
         var log = $n('pre'); log.className = 'output console'; hide(log);
         var result = $n('div'); result.className = 'doc';
         logBtn.onclick = function(){ toggleVisible(log); };
         box.appendChild(btn); box.appendChild(refreshBtn); box.appendChild(logBtn); box.appendChild(log); box.appendChild(result);
         ph.parentNode.replaceChild(box, ph);
         var outText, logText, buf;
         function run(done, fresh){
            outText = ''; logText = ''; buf = '';
            result.innerHTML = ''; log.textContent = ''; show(log);
            var params = {v: 'script', i: 'ido_report_cmd', src: getUrl(), cmd: w.cmd + (fresh ? ' _fresh_' : ''), stream: 2};
            rpc_stream(interp, params,
               function(text){
                  buf += text; var i;
                  while ((i = buf.indexOf('\n')) >= 0) {
                     var line = buf.slice(0, i + 1); buf = buf.slice(i + 1);
                     var data = line.slice(1);
                     if (line.charAt(0) === '2') { logText += data; log.textContent = logText; }
                     else { outText += data; result.innerHTML = renderMarkdown(outText); }
                  }
               },
               function(){ if (done) done(); },
               function(e){ logText += 'stream error: ' + e + '\n'; log.textContent = logText; show(log); if (done) done(); });
         }
         btn.onclick = function(){ run(); };
         refreshBtn.onclick = function(){ run(null, true); };
         return {run: run, log: log};
      }
      var cmdRunners = [], cmdLogs = [];
      function runAll(fresh){
         var i = 0;
         (function next(){ if (i < cmdRunners.length) cmdRunners[i++](next, fresh); })();
      }
      function toggleLogs(){
         var anyVisible = cmdLogs.some(function(l){ return isVisible(l); });
         cmdLogs.forEach(function(l){ anyVisible ? hide(l) : show(l); });
      }
      function renderDoc(content) {
         var interp = getInterp(content);
         var body = content.replace(/^#!cmd-interp .*$/m, '');
         var widgets = [];
         var replaced = body.replace(/((?:^|\n)```[\s\S]*?\n```|`[^`\n]*`)|\$\{([^}]+)\}/g, function(m, code, cmd){
            if (code) return code;
            var id = 'cmdw' + widgets.length;
            widgets.push({id: id, cmd: cmd});
            return '<span id="' + id + '"></span>';
         });
         setWindowTitle(getTitle(content));
         $("doc").innerHTML = renderMarkdown(replaced);
         cmdRunners = []; cmdLogs = [];
         for (var i = 0; i < widgets.length; i++) {
            var w = buildCmdWidget(widgets[i], interp);
            if (w) { cmdRunners.push(w.run); cmdLogs.push(w.log); }
         }
         var disp = cmdRunners.length ? 'inline' : 'none';
         $('run-all').style.display = disp;
         $('refresh-all').style.display = disp;
         $('log-all').style.display = disp;
      }

      var lastRendered = null; // updated by the editor save callback (makeEditor)

      // Auto-fit a preview iframe's height to its content. The embedded md view
      // renders asynchronously (readAsync fetches the source after load), so a
      // ResizeObserver on the content document re-measures whenever the body
      // resizes (initial render, edit re-renders, images). Same-origin only.
      function autoFitPreview(f) {
         function fit() {
            try {
               var d = f.contentDocument;
               if (!d || !d.documentElement) return;
               // Collapse first: documentElement.scrollHeight never reports less
               // than the viewport, so a tall iframe would otherwise pin itself
               // and never shrink when content gets smaller.
               f.style.height = '1px';
               void f.offsetHeight; // reflow so the measurement sees the collapse
               var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
               f.style.height = (h > 0 ? h : 1) + 'px';
            } catch (e) { /* not same-origin: keep placeholder height */ }
         }
         function attach() {
            var d = f.contentDocument;
            if (!d || !d.body) return;
            fit();
            if (f.__fitRO) f.__fitRO.disconnect();
            if (typeof ResizeObserver !== 'undefined') {
               f.__fitRO = new ResizeObserver(fit);
               f.__fitRO.observe(d.body);
               f.__fitRO.observe(d.documentElement);
            }
         }
         f.addEventListener('load', attach);
         attach();
      }
      // Link whose URL carries _v=inline: instead of navigating, preview it in an
      // inline iframe right below the link (click toggles; several may stay open).
      // `_v=` is the client-private param namespace (underscore-prefix convention):
      // the server never consumes it, so it is stripped when building the iframe
      // src (all other params kept).
      function iframePreviewInit() {
         function hrefNoPreviewParam(a) {
            try {
               var u = new URL(a.getAttribute('href'), window.location.href);
               return u.searchParams.get('_v') === 'inline' ? (u.searchParams.delete('_v'), u.href) : null;
            } catch (e) { return null; }
         }
         $('doc').addEventListener('click', function (ev) {
            if (ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button !== 0) return; // modifier click: browser default (new tab)
            var a = ev.target.closest ? ev.target.closest('a[href]') : null;
            var src = a && hrefNoPreviewParam(a);
            if (!src) return; // not a _v=inline link: leave default behavior untouched
            ev.preventDefault();
            if (a.__iframeBox) {
               var old = a.__iframeBox.querySelector('iframe');
               if (old && old.__fitRO) old.__fitRO.disconnect(); // no observer leak on collapse
               a.__iframeBox.remove(); a.__iframeBox = null; return;
            }
            var box = $n('div'); box.className = 'iframe-preview';
            var f = $n('iframe'); f.src = src;
            autoFitPreview(f);
            box.appendChild(f);
            var anchor = a.closest('li') || a.closest('p') || a;
            anchor.parentNode.insertBefore(box, anchor.nextSibling);
            a.__iframeBox = box;
         });
      }
      function initApp(){
        if (inIframe())hide($('head-bar'));
        makeEditor($('editor'), function (content){ lastRendered = content; renderDoc(content); });
        iframePreviewInit();
      }
    </script>
  </head>
  <body onload="initApp()">
    <nav id="head-bar"><a href="#" onclick="toggle_editor(); return false;">edit</a><a id="run-all" href="#" onclick="runAll(); return false;" style="display:none">run-all</a><a id="refresh-all" href="#" onclick="runAll(true); return false;" style="display:none">refresh-all</a><a id="log-all" href="#" onclick="toggleLogs(); return false;" style="display:none">log</a>
      <!-- <a href="https://www.google.com/cse/publicurl?cx=005037642699962415424:bbpmoxhiswm">search</a> -->
    <hr style="margin:0;"/>
    </nav>
    <div id="editor"></div>
    <div id="doc" class="doc"></div>
  </body>
</html>

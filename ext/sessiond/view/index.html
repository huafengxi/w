<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>chat</title>
<script type="application/javascript" src="/w/ext/markdown/deps/marked.min.js"></script>
<style>
:root {
  --bg: #ffffff; --panel: #f4f6f8; --panel2: #e9edf2; --fg: #1a1f26;
  --dim: #5a6472; --acc: #0969da; --ok: #1a7f37; --warn: #9a6700;
  --err: #cf222e; --line: #d0d7de;
}
* { box-sizing: border-box; }
/* 手机高度适配（任务 0830-1142-tx6v）：html/body 锁满高 + 禁页面级滚动，
   滚动只发生在 #stream 内；.layout 用 100dvh（动态视口，随浏览器工具栏/键盘
   收缩），旧浏览器回退 100vh。不用 100svh：svh 键盘弹出时留一大段空白且部分
   浏览器实现不稳；dvh + 下方 visualViewport JS 兜底覆盖面更完整。 */
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
/* flash 轻提示（任务 0829-2035-kyor：替代原顶部状态栏）：顶部居中浮层，自动隐藏；
   原走系统事件侧栏的用户可见提示（自愈失败、熔断等）改经它承载，错误不静默吞掉 */
.flashnotice { position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
  max-width: 80vw; padding: 6px 14px; border-radius: 8px; font-size: 12px;
  background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
  box-shadow: 0 4px 14px rgba(0,0,0,.12); z-index: 20;
  white-space: pre-wrap; word-break: break-word; }
.flashnotice.warn { color: var(--warn); border-color: var(--warn); }
.flashnotice.err { color: var(--err); border-color: var(--err); }
button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
button:hover { border-color: var(--acc); }
button.primary { background: var(--acc); border-color: var(--acc); color: #ffffff; }
.layout { display: flex; height: 100vh; height: 100dvh; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px;
  border: 1px solid var(--line); color: var(--dim); margin-left: 4px; }
.badge.run { color: var(--ok); border-color: var(--ok); }
.badge.off { color: var(--dim); } .badge.dis { color: var(--err); border-color: var(--err); }
#stream { flex: 1; overflow-y: auto; padding: 12px 16px; }
.ev { margin-bottom: 8px; }
/* 用户消息靠右（聊天惯例）：浅蓝底区分；无粗边条（任务 0829-2131-pdop
   inbox r3gt：整页所有消息块统一普通 1px 圆角边框） */
.role-user { background: #ddf4ff; border: 1px solid #b6e3ff;
  padding: 6px 10px; border-radius: 8px;
  white-space: pre-wrap; word-break: break-word; max-width: 80%; margin-left: auto; }
.md { word-break: break-word; }
.md p { margin: 4px 0; }
.md pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px; overflow-x: auto; font-size: 12px; }
.md code { background: var(--panel); padding: 1px 4px; border-radius: 4px;
  font-size: 12px; }
.md pre code { background: none; padding: 0; }
/* 极简内嵌语法高亮（不引外部库） */
.md pre code .tok-k { color: #cf222e; }
.md pre code .tok-s { color: #0a3069; }
.md pre code .tok-c { color: #6e7781; font-style: italic; }
.md pre code .tok-n { color: #953800; }
/* 折叠块展开指示三角移除（任务 0829-2052-rnfe）：thinking 及同类 <details>/<summary>
   的 disclosure marker 去掉，点按展开/收起功能保留 */
details summary { list-style: none; }
details summary::-webkit-details-marker { display: none; }
/* 组级折叠容器（0830-1039-a6vy，参考 pi-web ProcessDetailsGroup）：每条 assistant
   消息的 thinking + 工具块收进一组，header 小字 + 旋转箭头 + 计数；
   处理中展开、回合结束自动折叠、历史回放默认折叠、点 header 手动切换 */
.process-group { margin: 4px 0; }
.process-group summary { display: flex; align-items: center; gap: 6px; cursor: pointer;
  color: var(--dim); font-size: 12px; padding: 2px 0; user-select: none; }
.process-group summary .pg-arrow { display: inline-block; font-size: 10px;
  transition: transform .15s; }
.process-group[open] summary .pg-arrow { transform: rotate(90deg); }
/* 展开内容区无左侧竖线与左缩进（0830-1124-ysiy：Android 窄屏回收横向空间） */
.process-group .pg-body { margin: 2px 0; }
/* thinking 块（对齐 pi-web 观感，任务 0829-2107-cvdn；0829-2228-zq1t inbox thnk：
   展开后内容区参考工具调用色块样式——柔和底色块撑满、与标题行无缝贴合，
   同 5nnk 口径：相接处直角、无左右空隙；收起时仍是干净标题行盒子）：
   圆角边框盒子 + 顶部 Thinking 标题行，无三角（上方全局已去）；处理中与完成后
   标题行均显示累计字数（Thinking · N 字，0830-1125-n4hl）；点标题行展开/收起，默认折叠 */
.thinking-block { margin: 4px 0; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); overflow: hidden; }
.thinking-block summary { color: var(--dim); font-size: 12px; cursor: pointer;
  padding: 6px 10px; user-select: none; border-bottom: 1px solid transparent; }
.thinking-block[open] summary { border-bottom-color: var(--line); }
/* 展开内容区 = 柔和底色块（与 .targs 同族浅灰蓝）：margin 0 撑满、直角贴合标题行，
   底部圆角交给外框 overflow:hidden 裁切；基线（thinkingDetails）与流式（thinking_delta）
   共用同一 DOM/CSS，一处生效两处一致 */
.thinking-block pre { white-space: pre-wrap; word-break: break-word; color: var(--dim);
  font-style: italic; font-size: 12px; margin: 0; padding: 8px 10px;
  background: #e9eff7; border-radius: 0; }
.sys { color: var(--dim); font-size: 12px; }
.sys.warn { color: var(--warn); } .sys.err { color: var(--err); }
.tool-block { background: var(--panel); border: 1px solid var(--line);
  border-radius: 4px; margin: 2px 0; font-size: 12px; color: var(--dim); }
/* summary = 工具名 · 状态 + 关键参数预览 + 耗时（任务 0829-2035-kyor：去掉装饰图标） */
.tool-block summary { cursor: pointer; padding: 4px 8px; display: flex; gap: 6px;
  align-items: baseline; }
.tool-block summary .tprev { flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
.tool-block summary .tdur { flex: none; margin-left: auto; color: var(--dim);
  font-variant-numeric: tabular-nums; }
/* 工具块状态：无文字徽标（done/running/err 字样已移除），改用工具名颜色区分
   （任务 0829-2107-cvdn）——进行中=强调色（acc 蓝），完成=弱化色（dim 灰），
   错误=红；耗时保留在右侧。无左侧粗强调条（任务 0829-2131-pdop inbox l3ft：
   与 thinking 块同口径，普通 1px 圆角边框盒子） */
.tool-block summary .thead { font-weight: 600; }
.tool-block.run summary .thead { color: var(--acc); }
.tool-block.done summary .thead { color: var(--dim); font-weight: 400; }
.tool-block.err summary .thead { color: var(--err); }
/* Waiting for model 指示（任务 0829-2107-cvdn）：回合进行中且无流式产出时，
   聊天流末尾的低调提示行（呼吸动画） */
.waiting { color: var(--dim); font-size: 12px; font-style: italic; padding: 4px 0;
  animation: waitpulse 1.6s ease-in-out infinite; }
@keyframes waitpulse { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
/* 模型错误红框（任务 0829-2131-pdop，对齐 pi-web 观感）：assistant 错误消息 /
   agent_end、compaction_end 的 errorMessage 统一渲染为红边盒子；同文去重不叠框 */
.errbox { margin: 4px 0; border: 1px solid #ffcecb;
  background: #ffebe9; border-radius: 8px; padding: 8px 10px; color: var(--err);
  font-size: 13px; white-space: pre-wrap; word-break: break-word; }
/* Retrying 警告框（任务 0829-2131-pdop）：auto_retry_start 时聊天流末显示；
   auto_retry_end success 移除、failure 原地转红框常驻（复用 .errbox） */
.retrybox { margin: 4px 0; border: 1px solid #eed888;
  background: #fff8c5; border-radius: 8px; padding: 8px 10px; color: var(--warn);
  font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.tool-block .tbody { padding: 0; }
.tool-block pre { font-size: 11px; margin: 4px 0; white-space: pre-wrap;
  word-break: break-all; }
/* 参数/输出上下双色块（任务 0829-2131-pdop inbox t0ol：用户拍板；
   0829-2224-5nnk 无缝贴合：用户 2026-08-30 拍板两块间与左右零空隙）：
   参数=浅灰蓝、输出=浅暖灰，垂直零间距水平撑满（tbody padding 清零、块 margin 0）。
   圆角取舍：targs 上缘顶着 summary 行不贴工具块外框，故全直角；
   tout 底缘即工具块底缘，下两角 3px 随外框 4px+1px 边框内切。
   相接处双方均无圆角，零缝隙。基线与流式共用同一 DOM/CSS，一处生效。 */
.tool-block .targs { color: var(--dim); background: #e9eff7; border-radius: 0;
  margin: 0; padding: 6px 8px; }
.tool-block .tout { color: var(--fg); background: #f3efe9;
  border-radius: 0 0 3px 3px; margin: 0;
  padding: 6px 8px; max-height: 300px; overflow-y: auto; }
details.raw summary { color: var(--dim); font-size: 12px; cursor: pointer; }
details.raw pre { font-size: 11px; color: var(--dim); white-space: pre-wrap;
  word-break: break-all; margin: 2px 0; }
#inputbar { display: flex; gap: 8px; padding: 10px 0; }
/* QUEUED 面板（任务 0829-2115-zvti；设计口径 = pi-web QUEUED 截图参考，经 dispatcher
   inbox 2026-08-29-21-33 两条 inform 下发）：浅灰圆角盒子，头部一行「QUEUED · N」；
   每条 = 圆角小徽标（steer=蓝色描边强调 / follow-up=灰色弱化，等宽字体）+ 单行截断文本。
   右上无 Recall to input 按钮：本协议（pi rpc steer/follow_up）无召回能力，不提供。
   数据源 = queue_update 事件（后端权威，任务 0829-2131-pdop）；本地待发记录退化为
   发送瞬间的乐观补位，同文本不重复展示。 */
#queuedPanel { margin: 8px 16px 0; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); padding: 8px 10px; }
#queuedPanel .qp-head { font-size: 11px; color: var(--dim); letter-spacing: .5px;
  font-weight: 600; margin-bottom: 4px; }
#queuedPanel .qp-item { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
#queuedPanel .qp-badge { flex: none; font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo,
  Consolas, monospace; padding: 0 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--dim); background: var(--panel2); }
#queuedPanel .qp-badge.steer { border-color: var(--acc); color: var(--acc);
  background: var(--bg); }                                /* steer = 蓝色描边强调 */
#queuedPanel .qp-text { flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--fg); }
#queuedPanel .qp-item.rejected .qp-badge { border-color: var(--err); color: var(--err); }
#queuedPanel .qp-item.rejected .qp-text { color: var(--err); }
/* 待发送图片附件条（任务 0829-2103-8etk）：输入栏上方缩略图行 */
#attachBar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 0;
  border-top: 1px solid var(--line); background: var(--panel);
  align-items: center; }
.attach-thumb { position: relative; width: 56px; height: 56px;
  border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  background: var(--bg); }
.attach-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attach-thumb .rm { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px;
  padding: 0; font-size: 11px; line-height: 14px; text-align: center; border-radius: 50%;
  background: rgba(0,0,0,.6); color: #fff; border: none; cursor: pointer; }
#attachBar .clear-all { font-size: 12px; padding: 2px 8px; }
/* 消息内图片缩略图（自己发出的带图消息；点击查看原图）。
   块级独占一行（任务 0829-2131-pdop inbox q3pd：用户反馈图片换行更好）：
   流式与基线共用 renderUserMessage，一处生效两处一致 */
.msg-img-link { display: block; margin: 6px 0 0; line-height: 0;
  text-decoration: none; }
.msg-img { max-width: 180px; max-height: 180px; border-radius: 6px;
  border: 1px solid var(--line); cursor: pointer; }
/* 斜杠命令内联提示条：输入框上方，默认隐藏 */
.notice { padding: 4px 16px; font-size: 12px; color: var(--warn);
  background: var(--panel); border-top: 1px dashed var(--line);
  white-space: pre-wrap; word-break: break-word; }
.notice.err { color: var(--err); }
.notice.hidden { display: none; }
#promptInput { flex: 1; background: transparent; color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  font: inherit; resize: none; max-height: 120px; }
#promptInput:focus { outline: none; border-color: var(--acc); }
#dialogBox { position: fixed; right: 18px; bottom: 80px; width: 380px;
  max-width: 90vw; background: var(--panel2); border: 1px solid var(--warn);
  border-radius: 10px; padding: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.15);
  display: none; z-index: 10; }
#dialogBox h4 { margin: 0 0 6px; color: var(--warn); }
#dialogTitle { white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; }
#dialogOpts { display: flex; flex-direction: column; gap: 6px; }
#dialogOpts button { text-align: left; }
#dialogInput { width: 100%; background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  margin-bottom: 8px; font: inherit; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="flashNotice" class="flashnotice hidden"></div>
<div class="layout">
  <main>
    <div id="stream"></div>
    <div id="slashNotice" class="notice hidden"></div>
    <div id="attachBar" class="hidden"></div>
    <div id="queuedPanel" class="hidden"></div>
    <div id="inputbar">
      <textarea id="promptInput" rows="1" placeholder="Type a prompt or /command, Enter to send (queues automatically while streaming), Shift+Enter for newline"></textarea>
    </div>
  </main>
</div>

<div id="dialogBox">
  <h4 id="dialogMethod">dialog</h4>
  <div id="dialogTitle"></div>
  <input id="dialogInput" class="hidden" placeholder="Type here…">
  <div id="dialogOpts"></div>
  <div style="margin-top:8px; display:flex; gap:8px;">
    <button id="dialogCancel" onclick="replyDialog({cancelled:true})">Cancel</button>
    <span id="dialogTimeout" class="sys" style="align-self:center"></span>
  </div>
</div>

<script>
"use strict";
// URL 路径驱动会话（任务 0829-1958-od0t；R1：~/m 下任意 .jsonl 路径）：
// 会话 = 页面 URL 路径指向的 .jsonl（如 /assistant/foo.jsonl、/a/b/x.jsonl），
// 持久体即该文件，由 web 进程内按路径监督员直接监督（崩溃自动重启，
// 从该 jsonl resume）。不同目录的同名文件 = 不同会话。
// vmap 翻译是服务端行为，浏览器 location.pathname 仍是原始路径 → 直接解析。
const $ = id => document.getElementById(id);
const API = "/sessiond/rpc/api.py";
const STREAM = "/sessiond/rpc/stream.py";
// 会话路径解析：站内任意 /…*.jsonl（后端另有 ~/m 锁定校验）
function parseSessionFromUrl() {
  const p = location.pathname;
  return (/^\/.*[^\/]\.jsonl$/.test(p)) ? p : null;
}
const SESSION = parseSessionFromUrl();
if (SESSION) {
  document.title = SESSION.replace(/\.jsonl$/, "") + " · chat";
}
let attached = null;          // 当前挂接会话名（= URL 解析出的 SESSION）
let uidSeq = 0;
const uid = () => "web-" + (++uidSeq) + "-" + Date.now().toString(36);
let pendingImages = [];       // 待发送附件（任务 0829-2103-8etk）：{mime, b64, dataUrl}
// 待送达跟踪：cmd id -> {mode, text, rejected}；follow_up（流式中自动排队）送达前本地显示待发条目，
// 对应 user message 事件到达后转为正常用户消息（幂等：文本匹配）。
let pendingSends = {};
let pendingDialogs = {};      // id -> request
let curAssistantEl = null;    // 当前 assistant 消息渲染节点（实时流式）
let turnGroup = null;         // turn 级过程组引用：一个来回（turn）一个组，同回合多条 assistant 消息共享（0830-1047-ehzc）
let lastProcessGroup = null;  // 最近的组级折叠容器（工具块无明确归属时的兜底挂点，0830-1039-a6vy；指向 turnGroup）
let curAssistantBuf = "";     // 累积文本（用于 message_end 时 markdown 渲染）
// 流状态（两层锚定：entries 基线 + 事件 ID 游标）
let streamCtrl = null;        // AbortController
let streamCursor = "";        // 最后收到的事件 ID（<ns>:<seq>），续流游标
let lastEidNum = 0;           // 事件 ID 数字部分（本地连续性检查用）
let streamAlive = false;
let reconnectTimer = null;
// 基线锚定状态
let lastGen = null;           // 会话进程世代（gen 变化检测 → 基线自愈）
let curLeafId = null;         // 活跃分支叶
let curProvider = null;       // 当前模型 provider/modelId（model_change 跟踪，/model 用）
let curModelId = null;
let curThinkingLevel = null;  // 当前思考强度（thinking_level_change + get_state 跟踪，0830-1257-vwzb）
// 会话状态行 2（0830-1257-vwzb inbox 增项）：msgs/compacting 来自 get_state 响应，
// gen/restarts 来自 op=status；缺失显 ?。
let curMsgCount = null;
let curCompacting = null;
let curGen = null;
let curRestarts = null;
let curCtx = null;            // 上下文占用（0830-1324-3qet）：get_session_stats 的 contextUsage{tokens,contextWindow,percent}
let seenEntryIds = new Set(); // 已渲染 entry（幂等去重）
let seenToolIds = new Set();  // 已渲染 toolCallId（entries ↔ 实时事件互斥）
let toolBlocks = {};          // toolCallId -> 折叠块引用
let healBusy = false;
let healFails = 0;
// 流式渐进 markdown：text_delta 累积后节流重渲染，每次渲染都过消毒；
// message_end 最终收尾渲染一次。
let mdRenderTimer = null;
const MD_RENDER_MS = 150;
// dialog 倒计时
let dialogTimer = null;
let dialogDeadline = 0;
// Waiting for model 指示（任务 0829-2107-cvdn）：回合进行中但无流式产出时显示；
// 状态机：user message_start = 回合开始（turnActive），agent_end = 回合结束；
// turn_end 仅是子回合边界——每个 assistant 子回合（含以 tool call 结束的）都发一次，
// 一次 agent run 发多个、仅一个 agent_end，不清 turnActive（0830-1029-urgg）；
// 显示时机 = 回合中且无流式产出（用户消息发出后等首个产出、工具执行完成后等下一轮
// 模型响应）；任一模型产出帧（assistant message_start / message_update /
// tool_execution_start）到达即移除。纯前端基于现有 SSE 事件推断，无后端新事件。
let turnActive = false;
let waitingEl = null;
// 回合状态三件套（任务 0829-2131-pdop）：
// ① retryBoxEl = 当前 Retrying 警告框（auto_retry_start 建，end success 移除 / failure 转红框）；
// ② lastRenderedErrorMsg = 最近已渲染的模型错误文本（agent_end/compaction_end 的
//    errorMessage 与之相同时去重，不叠两个红框）；
// ③ queueState = queue_update 下发的后端权威队列（steering/followUp），
//    本地待发 pendingSends 退化为发送瞬间的乐观补位。
let retryBoxEl = null;
let lastRenderedErrorMsg = null;
let queueState = {steering: [], followUp: []};

// ---------------- 基础请求 ----------------
async function api(op, extra) {
  const body = new URLSearchParams(Object.assign({op: op}, extra || {}));
  const r = await fetch(API, {method: "POST", credentials: "same-origin",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: body.toString()});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("" + r.status));
  return j;
}

// ---------------- flash 轻提示（任务 0829-2035-kyor：原顶部状态栏已移除；
// op=status API 后端保留供评审/调试，前端不再展示 gen/restarts/pid/cwd 等内部字段） ----------------
let flashTimer = null;
function flash(info, cls) {
  const el = $("flashNotice");
  el.textContent = info;
  el.className = "flashnotice" + (cls ? " " + cls : "");
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    el.classList.add("hidden"); flashTimer = null;
  }, cls === "err" ? 8000 : 4000);   // 错误提示多停留一会儿，别静默吞掉
}

// ---------------- 提示音（任务 0829-2103-dpe4：WebAudio 合成短促 beep，无音频文件） ----------------
// 触发：① assistant 一轮结束（turn_end/agent_end）→ done 音；
//       ② 页签后台（document.hidden）时收到新注入的消息/通知事件 → notify 音。
// 自动播放策略：AudioContext 在首次用户手势（点击/按键）时创建+resume；
// 未交互前 beep 静默跳过，不报错。开关仅斜杠命令 /sound（默认开，无图形控件）。
let soundOn = true;
let soundCtx = null;
let soundUnlocked = false;
let lastBeepAt = 0;
function soundUnlock() {
  if (soundUnlocked) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!soundCtx) soundCtx = new AC();
    soundCtx.resume().then(() => { soundUnlocked = true; }).catch(() => {});
  } catch (e) {}
}
window.addEventListener("pointerdown", soundUnlock, true);
window.addEventListener("keydown", soundUnlock, true);
function beep(kind) {
  if (!soundOn || !soundCtx || soundCtx.state !== "running") return;  // 未交互/未解锁：静默
  if (Date.now() - lastBeepAt < 300) return;                          // 节流：连续触发只响一次
  lastBeepAt = Date.now();
  try {
    const t0 = soundCtx.currentTime;
    const osc = soundCtx.createOscillator();
    const gain = soundCtx.createGain();
    osc.connect(gain); gain.connect(soundCtx.destination);
    if (kind === "done") {                    // 双音上行（880→1174.7Hz），~0.24s
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, t0);
      osc.frequency.setValueAtTime(1174.66, t0 + 0.09);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      osc.start(t0); osc.stop(t0 + 0.24);
    } else {                                  // 单音短 beep（660Hz），~0.14s
      osc.type = "sine";
      osc.frequency.setValueAtTime(660, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.1, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
      osc.start(t0); osc.stop(t0 + 0.14);
    }
  } catch (e) {}
}

// ---------------- 挂接（基线 → 记水位 → 续流） ----------------
async function attach(name) {
  if (attached === name && streamAlive) return;
  stopStream();
  clearPendingDialogs();
  $("stream").innerHTML = "";
  curAssistantEl = null; curAssistantBuf = ""; lastProcessGroup = null; turnGroup = null;  // turn 组随清屏重置（0830-1047-ehzc）
  seenEntryIds = new Set(); seenToolIds = new Set(); toolBlocks = {};
  turnActive = false; waitingEl = null;                 // 重挂接重置等待指示（0829-2107-cvdn）
  pendingSends = {}; queueState = {steering: [], followUp: []};
  curMsgCount = null; curCompacting = null; curGen = null; curRestarts = null;  // 跨会话状态行重置（0830-1257-vwzb inbox 增项）
  curCtx = null;                                      // 上下文占用随重挂接重置（0830-1324-3qet）
  retryBoxEl = null; lastRenderedErrorMsg = null;       // 回合状态重置（0829-2131-pdop）
  renderQueuedPanel();                                  // 待发/队列面板随清屏重置（0829-2115-zvti）
  sysLine("Attaching " + name + ": fetching history baseline (get_entries)…");
  let doc;
  try { doc = await api("attach", {session: name}); }
  catch (e) { sysLine("Attach failed: " + e.message, "err"); return; }
  attached = name;
  applyBaseline(doc, true);
}

// 基线落盘：渲染活跃分支、记游标/水位、开流
function applyBaseline(doc, initial) {
  lastGen = doc.gen !== undefined ? doc.gen : lastGen;
  curLeafId = doc.leafId || null;
  const branch = activeBranch(doc.entries || [], curLeafId);
  if (!initial) {
    $("stream").innerHTML = "";
    curAssistantEl = null; curAssistantBuf = ""; lastProcessGroup = null; turnGroup = null;  // turn 组随清屏重置（0830-1047-ehzc）
    seenEntryIds = new Set(); seenToolIds = new Set(); toolBlocks = {};
    turnActive = false; waitingEl = null;               // 自愈重渲染重置（0829-2107-cvdn）
    pendingSends = {}; queueState = {steering: [], followUp: []};
    retryBoxEl = null; lastRenderedErrorMsg = null;     // 回合状态重置（0829-2131-pdop）
    renderQueuedPanel();                                // 全量重渲染：待发/队列面板一并清除（0829-2115-zvti）
  }
  for (const e of branch) renderEntry(e);
  curAssistantEl = null; curAssistantBuf = "";  // 基线内的插入锚点不外漏到实时流（0830-1047-ehzc）
  // 重建悬空 dialog（0830-0956-vk20 bug2）：extension_ui_request 不在 entries 里，
  // 离线/刷新期间触发的 ask_user 仅凭事件环收不到（续流游标在其后）——后端随基线
  // 下发权威快照，逐个重建（showDialog 同 id 幂等，不会叠框）。
  for (const d of doc.pendingDialogs || []) showDialog(d);
  streamCursor = doc.watermark || "";
  lastEidNum = eidNum(streamCursor);
  openStream();
  sysLine("Baseline " + (doc.entries || []).length + " entries (active branch "
    + branch.length + ")");
  sendGetState();                              // 基线完成 → 拉权威模型/思考强度（0830-1257-vwzb）
  sendCtxStats();                              // 基线完成 → 拉上下文占用（0830-1324-3qet）
}

// 活跃分支：从 leafId 沿 parentId 走回根（含 pre-compaction 链）
function activeBranch(entries, leafId) {
  if (!leafId) return [];
  const byId = {};
  for (const e of entries) if (e && e.id) byId[e.id] = e;
  const out = [];
  let cur = leafId, guard = entries.length + 1;
  while (cur && guard-- > 0) {
    const e = byId[cur];
    if (!e) break;
    out.push(e);
    cur = e.parentId;
  }
  return out.reverse();
}

// entry → 渲染（基线的持久体视图）
function renderEntry(e) {
  if (!e || !e.id || seenEntryIds.has(e.id)) return;   // 幂等
  const t = e.type;
  if (t === "message" && e.message) { renderEntryMessage(e.message); return; }
  if (t === "session_info") return;                     // 噪音，跳过
  if (t === "model_change") { curProvider = e.provider || curProvider;
    curModelId = e.modelId || curModelId;
    sysLine("◆ model → " + (e.provider || "?") + "/" + (e.modelId || "?")); return; }
  if (t === "thinking_level_change") { curThinkingLevel = e.thinkingLevel || curThinkingLevel;  // 0830-1257-vwzb：基线同步跟踪思考强度（与 model_change 同口径）
    sysLine("◆ thinking → " + (e.thinkingLevel || "?")); return; }
  sysLine("◆ " + (t || "?"));
}
function renderEntryMessage(m) {
  const role = m.role;
  if (role === "user") {
    renderUserMessage(m);                       // 基线渲染：文本 + 图片缩略图
    return;
  }
  if (role === "toolResult") {
    const key = "r:" + m.toolCallId;
    if (seenToolIds.has(key)) return;                   // 与实时事件互斥
    seenToolIds.add(key);
    let blk = m.toolCallId ? toolBlocks[m.toolCallId] : null;
    if (!blk) blk = toolBlock(m.toolCallId, m.toolName);
    blk.outPre.textContent = resultText(m);             // 并入所属工具块
    // 耗时：基线无 exec 事件 → 用消息时间戳近似（assistant→result）
    if (blk.t0 != null && m.timestamp != null)
      setToolDur(blk, m.timestamp - blk.t0);
    setToolStatus(blk, m.isError ? "err" : "done");
    return;
  }
  if (role === "assistant") {
    const el = addDiv("role-assistant md", "");
    curAssistantEl = el;                          // 基线插入锚点：turn 组定位于当前 assistant 元素之前（0830-1047-ehzc）
    const emsg = errMsgOf(m);                     // 基线回放中的模型错误 → 红框（0829-2131-pdop）
    let text = "";
    for (const p of m.content || []) {
      if (!p) continue;
      if (p.type === "thinking" && p.thinking) {
        // 入 turn 级组容器（基线回放 = 已完成 → 默认折叠，0830-1039-a6vy；turn 粒度 = 0830-1047-ehzc）
        grpAddBlock(processGroup(false), thinkingDetails(p.thinking), false);
      } else if (p.type === "text") {
        text += (text ? "\n" : "") + (p.text || "");
      } else if (p.type === "toolCall") {
        if (p.id && !seenToolIds.has(p.id)) {
          seenToolIds.add(p.id);
          const blk = toolBlock(p.id, p.name, processGroup(false)); // 入 turn 组；结果由 toolResult 条目并入
          blk.argsPre.textContent = fmtArgs(p.arguments);
          setToolPreview(blk, p.name, p.arguments);     // summary 参数预览
          if (m.timestamp != null) blk.t0 = m.timestamp;
        }
      }
    }
    renderMarkdownInto(mdDiv(el), text);                // 不擦除 thinking/工具子节点
    if (emsg) renderErrorBox(emsg);
    return;
  }
  sysLine("◆ message role=" + role);
}

// ---------------- 自愈闭环（缺口/gen 变化 → 全量基线重拉 → 新水位续流） ----------------
// 页面级策略 = 全量重渲染（清屏 + 活跃分支重建）：消息对象无稳定 id，增量
// entries 与已实时渲染的消息无法按 id 互斥，全量重渲染是无重的构造性保证。
async function heal(reason) {
  if (healBusy || !attached) return;
  healBusy = true;
  stopStream();
  flash("Refreshing history… (" + reason + ")");
  try {
    const doc = await api("attach", {session: attached});   // 全量基线
    applyBaseline(doc, false);
    healFails = 0;
    flash("History refreshed ✓ (" + reason + ")");
    sysLine("Healed (" + reason + ", full baseline refetch)");
    scrollStream();
  } catch (e) {
    healFails++;
    sysLine("Heal failed (" + reason + "): " + e.message, "err");
    if (healFails < 5) setTimeout(() => { healBusy = false; heal(reason); }, 2000);
    else { sysLine("Heal retries exhausted — refresh or re-attach manually", "err"); healBusy = false; return; }
  }
  healBusy = false;
}

function stopStream() {
  streamAlive = false;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (streamCtrl) { try { streamCtrl.abort(); } catch (e) {} streamCtrl = null; }
}

function openStream() {
  if (!attached) return;
  streamAlive = true;
  streamCtrl = new AbortController();
  const url = STREAM + "?session=" + encodeURIComponent(attached)
    + "&since=" + encodeURIComponent(streamCursor || "");
  fetch(url, {credentials: "same-origin", signal: streamCtrl.signal})
    .then(resp => {
      if (!resp.ok) throw new Error("stream " + resp.status);
      const reader = resp.body.getReader();
      const dec = new TextDecoder("utf-8");
      let buf = "";
      const pump = () => reader.read().then(r => {
        if (!streamAlive) return;
        if (r.done) { throw new Error("stream ended"); }
        buf += dec.decode(r.value, {stream: true});
        buf = drainFrames(buf);
        return pump();
      });
      return pump();
    })
    .catch(e => {
      if (!streamAlive) return;           // 主动断开，不重连（重连静默，防刷屏）
      reconnectTimer = setTimeout(openStream, 1500);
    });
}

function eidNum(eid) {
  // eid 形如 "<bridge-ns>:<seq>"；取末段序号做本地连续性检查
  if (typeof eid !== "string") return 0;
  const i = eid.lastIndexOf(":");
  const n = parseInt(i >= 0 ? eid.slice(i + 1) : eid.replace(/^e/, ""), 10);
  return isNaN(n) ? 0 : n;
}

// 解析 SSE 帧（id:/data:），返回未消费完的剩余缓冲
function drainFrames(buf) {
  let idx;
  while ((idx = buf.indexOf("\n\n")) >= 0) {
    const frame = buf.slice(0, idx);
    buf = buf.slice(idx + 2);
    let id = null, data = null;
    for (const line of frame.split("\n")) {
      if (line.startsWith("id:")) id = line.slice(3).trim();
      else if (line.startsWith("data:")) data = line.slice(5).trim();
    }
    if (data === null) continue;          // 注释/keep-alive
    if (id !== null) {
      const n = eidNum(id);
      // 本地连续性检查（服务端之外的第二道缺口探测）
      if (n > 0 && lastEidNum > 0 && n > lastEidNum + 1) {
        // 同桥内跳号（跨桥时服务端会先发 webgw.gap 帧，此处为第二道探测）
        streamCursor = id; lastEidNum = n;
        let obj; try { obj = JSON.parse(data); } catch (e) { obj = null; }
        if (obj && obj.type !== "webgw.gap") { heal("seq jump " + lastEidNum + "→" + n); return ""; }
      }
      streamCursor = id; lastEidNum = n;
    }
    let obj; try { obj = JSON.parse(data); } catch (e) { continue; }
    handleEvent(obj);
  }
  return buf;
}

// ---------------- 事件渲染（实时流） ----------------
function handleEvent(o) {
  const t = o.type;
  if (t === "webgw.gap") {
    flash("Event stream gap → healing baseline…", "warn");
    heal("event ring eviction");
    return;
  }
  if (t === "sessiond.error") { flash("sessiond: " + o.message, "err"); return; }
  if (t === "sessiond.session_restarting") {
    if (o.reload) {
      // 进程级 reload：主动重启，立即重拉（无退避）；
      // 后续 session_restarted 的 gen 变化触发现有基线自愈。
      flash("Session reloading… (resume from jsonl right after kill)", "warn");
    } else flash("Session process died, restarting in " + (o.delay || 0) + "s", "warn");
    return;
  }
  if (t === "sessiond.session_restarted") {
    flash("Session restarted", "warn");
    if (lastGen !== null && o.gen !== undefined && o.gen !== lastGen) {
      lastGen = o.gen;
      heal("session process restart gen→" + o.gen);   // 会话重启 → 以 entries 为准校准
    } else if (o.gen !== undefined) lastGen = o.gen;
    return;
  }
  if (t === "sessiond.session_disabled") { flash("Session disabled (crash loop)", "err");
    turnActive = false; hideWaiting(); return; }
  if (t === "sessiond.dialog_resolved") {
    if (pendingDialogs[o.id]) closeDialog(o.id, "answered");
    return;
  }
  // 提示音触发（任务 0829-2103-dpe4；done 音收口 = 0830-0925-jv9f；
  // message_start 降噪 = 0830-1036-8p9g）：
  // ② 后台收到新注入的消息/通知类事件 → notify 音（message_start 新消息、
  //    sessiond.error 通知、extension_ui_request 待用户应答的 dialog）；
  //    message_start 仅在 !turnActive 时响：回合内每次工具调用后模型续写会开新
  //    assistant message（即每个子回合都有 message_start），turnActive=true 时属
  //    回合内续写 → 静默，避免后台每个工具调用都响一声。判定先于下方 renderEvent，
  //    而 turnActive 在 renderEvent 里收到 user message_start 时才置 true，故回合
  //    起点的首个 message_start 仍会响一声（整个回合的起点，属预期）；
  // ① 整个处理完成 → done 音：只在 agent_settled 响（agent 运行彻底落定：
  //    无自动重试、无 compaction、无队列续跑，会话回到等待用户输入终态）。
  //    旧版在 turn_end/agent_end 都响 → 带工具调用的回合每轮都响，太吵。
  //    实证（/tmp/beep-test 单工具回合）：turn_end x2 / agent_end x1 /
  //    agent_settled x1；agent_settled 由 pi agent-session finally 保证发出，
  //    rpc 模式经 toJsonEvent 原样透传到本流（事件本身按 side 分类不渲染，
  //    声音是它唯一的用户可见产出）。
  if (document.hidden && t === "message_start" && !turnActive) beep("notify");
  if (document.hidden && (t === "sessiond.error" || t === "extension_ui_request")) beep("notify");
  if (t === "agent_settled") { beep("done"); collapseProcessGroups(); }  // 回合彻底落定 → 组折叠（0830-1039-a6vy）
  if (t === "turn_end") hideWaiting();                  // 子回合边界：仅清等待指示，不清 turnActive（0830-1029-urgg）
  if (t === "agent_end") {
    turnActive = false; hideWaiting();
    collapseProcessGroups();                            // agent run 结束 → 自动折叠过程组（0830-1039-a6vy）
  }
  if (t === "response") { handleCmdResponse(o); }       // 上行命令回执（0829-2115-zvti）
  renderEvent(o);
}

function renderEvent(o) {
  const t = o.type;
  // ---- 回合状态三件套（任务 0829-2131-pdop）：重试/队列/终结错误帧 ----------------
  if (t === "auto_retry_start") { showRetryBox(o); return; }
  if (t === "auto_retry_end") { endRetryBox(o); return; }
  if (t === "queue_update") {
    queueState = {steering: Array.isArray(o.steering) ? o.steering : [],
                  followUp: Array.isArray(o.followUp) ? o.followUp : []};
    renderQueuedPanel();
    return;
  }
  if ((t === "agent_end" || t === "compaction_end") && o.errorMessage) {
    renderErrorBox(o.errorMessage);              // 内部与已渲染的 assistant 错误去重
    return;
  }
  // 模型/思考强度静默跟踪（任务 0830-1257-vwzb）：这两类帧会被下方 side 过滤丢弃，
  // 丢弃前先更新三变量（不新增 flash/sysLine）；斜杠提示可见时顺带刷新状态行。
  if (t === "model_change") {
    curProvider = o.provider || curProvider; curModelId = o.modelId || curModelId;
    refreshSlashNoticeIfVisible(); return;
  }
  if (t === "thinking_level_change") {
    curThinkingLevel = o.thinkingLevel || curThinkingLevel;
    refreshSlashNoticeIfVisible(); return;
  }
  if (classifyEvent(o) === "side") return;   // 其余系统/控制面帧不展示（任务 0829-2035-kyor）
  if (t === "message_start") {
    const m = o.message || {};
    if (m.role === "user") {
      resolvePendingByMessage(m);             // 待发条目转正（0829-2115-zvti）
      renderUserMessage(m);                     // 流式渲染：文本 + 图片缩略图（同一入口，内含 turnGroup 重置）
      curAssistantEl = null; curAssistantBuf = "";
      turnActive = true;                        // 回合开始：等模型首个产出（0829-2107-cvdn）
      showWaiting();
    } else if (m.role === "assistant") {
      hideWaiting();                            // 模型已开始输出本轮消息（0829-2107-cvdn）
      curAssistantEl = addDiv("role-assistant md", "");
      curAssistantBuf = "";
      lastRenderedErrorMsg = null;              // 新消息开始，重置错误去重键（0829-2131-pdop）
    }
    return;
  }
  if (t === "message_update") {
    hideWaiting();                              // 任一流式内容帧到达 → 移除等待指示（0829-2107-cvdn）
    const ev = o.assistantMessageEvent || {};
    if (!curAssistantEl) { curAssistantEl = addDiv("role-assistant md", ""); curAssistantBuf = ""; }
    if (ev.type === "text_delta") {
      curAssistantBuf += ev.delta || "";
      scheduleMdRender();                               // 渐进 markdown（节流，每次过消毒）
    } else if (ev.type === "thinking_delta") {
      // thinking 实时流：并入默认折叠块，块本身挂入 turn 级组容器（处理中 → 组展开）
      // 标题行随 delta 累计显示字数：Thinking · N 字（0830-1125-n4hl）
      let th = curAssistantEl._think;
      if (!th) {
        const d = document.createElement("details");    // 无 open = 默认折叠（块级折叠行为不变）
        d.className = "thinking-block";
        const s = document.createElement("summary");
        s.textContent = "Thinking";
        const cnt = document.createElement("span");     // 独立计数 span，避免每次重设整串（0830-1125-n4hl）
        s.appendChild(cnt);
        const pre = document.createElement("pre");
        d.appendChild(s); d.appendChild(pre);
        grpAddBlock(processGroup(true), d, false);      // 0830-1039-a6vy；turn 粒度 = 0830-1047-ehzc
        th = curAssistantEl._think = {pre: pre, buf: "", cnt: cnt};
      }
      th.buf += ev.delta || "";
      th.pre.textContent = th.buf;
      th.cnt.textContent = " · " + fmtThinkingCount(th.buf.length) + " 字";  // 累计字数感知进度（0830-1125-n4hl）
    } else if (ev.type === "toolcall_end") {
      const tc = ev.toolCall || {};
      if (tc.id) {
        if (seenToolIds.has(tc.id)) return;   // 基线已渲染（幂等）
        seenToolIds.add(tc.id);
        // 建折叠块并入 turn 级组容器（处理中 → 组展开）；start/update/end 并入
        const blk = toolBlock(tc.id, tc.name, processGroup(true));  // turn 粒度 = 0830-1047-ehzc
        blk.argsPre.textContent = fmtArgs(tc.arguments);
        setToolPreview(blk, tc.name, tc.arguments);     // summary 参数预览
      }
    }
    scrollStream();
    return;
  }
  if (t === "message_end") {
    const m = o.message || {};
    if (mdRenderTimer) { clearTimeout(mdRenderTimer); mdRenderTimer = null; }
    if (m.role === "assistant" && curAssistantEl) {
      const txt = curAssistantBuf || msgText(m);
      renderMarkdownInto(mdDiv(curAssistantEl), txt);   // 最终收尾渲染（不擦除 thinking 折叠块）
      if (!curAssistantEl._think) {                     // 无流式 delta 的 thinking 兜底补入
        for (const p of m.content || [])
          if (p && p.type === "thinking" && p.thinking)
            grpAddBlock(processGroup(true), thinkingDetails(p.thinking), false);  // turn 粒度 = 0830-1047-ehzc
      }
    }
    if (m.role === "assistant") {
      for (const p of m.content || [])
        if (p && p.type === "toolCall" && p.id) seenToolIds.add(p.id);
      const emsg = errMsgOf(m);                         // 模型错误 → 红框（0829-2131-pdop）；
      // 不依赖 curAssistantEl，无前置 message_start 的帧也能出框（去重逻辑内置）
      if (emsg) renderErrorBox(emsg);
    }
    if (m.role === "toolResult" && m.toolCallId) {
      seenToolIds.add("r:" + m.toolCallId);
      showWaiting();                            // 工具结果落盘后等下一轮模型响应（0829-2107-cvdn）
    }
    curAssistantEl = null; curAssistantBuf = "";
    return;
  }
  if (t === "tool_execution_start") {
    hideWaiting();                              // 工具开始执行 = 有产出，隐藏等待（0829-2107-cvdn）
    const id = o.toolCallId;
    let blk = id ? toolBlocks[id] : null;               // toolcall_end 先建过 → 复用
    if (!blk) {
      if (id && seenToolIds.has(id)) return;  // 基线已渲染（幂等）
      blk = toolBlock(id, o.toolName);
    }
    if (id) seenToolIds.add(id);
    if (!blk.argsPre.textContent) blk.argsPre.textContent = fmtArgs(o.args);
    if (!blk.prev.textContent) setToolPreview(blk, o.toolName, o.args);
    if (blk.t0 == null) blk.t0 = Date.now();            // 计时起点（pi 事件无时间戳）
    setToolStatus(blk, "running");
    scrollStream(); return;
  }
  if (t === "tool_execution_update") {
    // 流式行并入所属工具块；partialResult 是累积值 → 整段替换
    const id = o.toolCallId;
    if (id && seenToolIds.has("r:" + id)) return;       // 基线已收尾（幂等）
    let blk = id ? toolBlocks[id] : null;
    if (!blk) blk = toolBlock(id, o.toolName);
    blk.outPre.textContent = resultText(o.partialResult);
    scrollStream(); return;
  }
  if (t === "tool_execution_end") {
    if (o.toolCallId) {
      const key = "r:" + o.toolCallId;
      if (seenToolIds.has(key)) return;       // 基线已渲染（幂等）
      seenToolIds.add(key);
    }
    let blk = o.toolCallId ? toolBlocks[o.toolCallId] : null;
    if (!blk) blk = toolBlock(o.toolCallId, o.toolName);
    blk.outPre.textContent = resultText(o.result);
    if (blk.t0 != null) setToolDur(blk, Date.now() - blk.t0);   // 耗时
    setToolStatus(blk, o.isError ? "err" : "done");
    showWaiting();                              // 工具执行完成 → 等下一轮模型响应（0829-2107-cvdn）
    scrollStream(); return;
  }
  if (t === "extension_ui_request") { showDialog(o); return; }
}

// ---------------- 事件分类（主流 = 对话；其余系统/控制面帧不展示） ----------------
const MAIN_EVENT_TYPES = new Set(["message_start", "message_update", "message_end",
  "tool_execution_start", "tool_execution_update", "tool_execution_end",
  "extension_ui_request"]);                                   // thinking 随 message_update 走主流
function classifyEvent(o) {
  return (o && MAIN_EVENT_TYPES.has(o.type)) ? "main" : "side";
}

// ---------------- 回合状态三件套（任务 0829-2131-pdop） ----------------
// 模型错误判定（真实帧形态已核实：run/temp/chat-img-test-*.jsonl 内
// "stopReason":"error" + "errorMessage":"400: {...}"）：权威信号 = stopReason
// 为 error，文案取 errorMessage（缺失时退消息文本）。pi TUI 同口径（源码：
// assistant-message.js 以 theme.fg("error", `Error: ${errorMsg}`) 渲染）。
function errMsgOf(m) {
  if (!m || m.stopReason !== "error") return null;
  return String(m.errorMessage || msgText(m) || "").trim() || "Unknown error";
}
// 红框渲染：同文去重（不叠两个框）——assistant 错误消息已渲染过后，
// agent_end/compaction_end 携相同 errorMessage 不再重复出框。
function renderErrorBox(text) {
  const s = String(text || "").trim();

  lastRenderedErrorMsg = s;
  hideWaiting();                                  // 与 waiting 行同现时优先展示错误（0829-2107-cvdn 协调）
  const d = addDiv("errbox", "");

}
// Retrying 警告框：auto_retry_start → 聊天流末橙/黄框；
// auto_retry_end success → 移除（+ flash 恢复提示），failure → 原地转红框常驻。
function showRetryBox(o) {
  hideWaiting();                                  // 重试等待期间由警告框代言，不与 waiting 行重叠
  const sec = (typeof o.delayMs === "number") ? Math.max(1, Math.round(o.delayMs / 1000)) : null;
  let msg = "Retrying (" + (o.attempt || 1) + "/" + (o.maxAttempts || "?") + ")"
    + (sec != null ? " in " + sec + "s" : "") + "\u2026";
  if (o.errorMessage) msg += "\n" + trunc(String(o.errorMessage), 300);
  if (!retryBoxEl) retryBoxEl = addDiv("retrybox", "");
  retryBoxEl.textContent = msg;
  scrollStream();
}
function endRetryBox(o) {
  if (o.success) {
    if (retryBoxEl) { retryBoxEl.remove(); retryBoxEl = null; }
    flash("Retry succeeded, model recovered");    // 可选恢复提示（需求 2）
    return;
  }
  // 失败：原地转红框常驻（不走 renderErrorBox 的同文去重，保留重试失败这一独立事实）
  const txt = "Retries exhausted (" + (o.attempt || "?") + "): "
    + (o.finalError || o.errorMessage || "unknown error");
  if (retryBoxEl) {
    retryBoxEl.className = "ev errbox";
    retryBoxEl.textContent = txt;
    retryBoxEl = null;
  } else {
    const d = addDiv("errbox", "");
    d.textContent = txt;
  }
  lastRenderedErrorMsg = null;                    // 后续同文错误帧仍可出框（语义已不同）
  scrollStream();
}

// ---------------- Waiting for model 指示（任务 0829-2107-cvdn） ----------------

// ---------------- thinking/工具调用折叠块 ----------------

// 流式处理中与基线/回放结束态共用，保证两处格式一致。
function fmtThinkingCount(n) {
  if (n < 1000) return String(n);

function thinkingDetails(text) {

// turn 级组级折叠容器（0830-1039-a6vy 引入；0830-1047-ehzc 粒度修订：从每条

// thinking + 工具块收进同一个组，最终回答文本留在各自 assistant div 内（组外）。
// 组是 stream 顶层元素，懒创建：首个过程块到达才建组（纯文本消息不出空壳），
// 插入到当前 assistant 元素之前（保证位于该回合所有文本之前；锚点缺失则 append）；
// header 计数自然累计全回合。turnGroup 在 user message_start（renderUserMessage）

function processGroup(open) {

function grpAddBlock(grp, node, isTool) {

function collapseProcessGroups() {

  // 自愈/重挂接的全量重渲染不走这里——基线重建时组一律默认折叠。
  document.querySelectorAll(".process-group").forEach(d => { d.open = false; });
}
// 工具调用整段（tool_execution_start→result，含其间 update 流式行）折叠为一块；
// 块级折叠独立于组级折叠（展开组后仍可单独展开看详情）；
// 状态无文字徽标，由颜色区分（run=强调/done=弱化/err=红，任务 0829-2107-cvdn）。
function toolBlock(id, name, grp) {
  if (id && toolBlocks[id]) return toolBlocks[id];
  const det = document.createElement("details");        // 默认折叠
  det.className = "ev tool-block run";
  const sum = document.createElement("summary");
  const head = document.createElement("span");
  head.className = "thead";
  head.textContent = name || "?";                       // 无文字状态徽标，状态用颜色表达（0829-2107-cvdn）
  const prev = document.createElement("span"); prev.className = "tprev";  // 参数预览
  const dur = document.createElement("span"); dur.className = "tdur";     // 耗时，右对齐
  sum.appendChild(head); sum.appendChild(prev); sum.appendChild(dur);
  const body = document.createElement("div");
  body.className = "tbody";
  const argsPre = document.createElement("pre"); argsPre.className = "targs";
  const outPre = document.createElement("pre"); outPre.className = "tout";
  body.appendChild(argsPre); body.appendChild(outPre);
  det.appendChild(sum); det.appendChild(body);
  const host = grp || lastProcessGroup;                 // 无明确归属（孤儿工具帧）兜底挂最近一组（0830-1039-a6vy）
  if (host) grpAddBlock(host, det, true);
  else $("stream").appendChild(det);                    // 连组都没有（异常帧）→ 直挂聊天流，不丢内容
  const blk = {det: det, prev: prev, dur: dur, argsPre: argsPre, outPre: outPre, t0: null};
  if (id) toolBlocks[id] = blk;
  return blk;
}
function setToolStatus(blk, status) {
  // 状态只改 class（颜色表达），不再写文字徽标（任务 0829-2107-cvdn）
  blk.det.className = "ev tool-block "
    + (status === "done" ? "done" : status === "err" ? "err" : "run");
}
function fmtArgs(args) {
  if (args == null) return "";
  const s = typeof args === "string" ? args : JSON.stringify(args, null, 2);
  return trunc(s, 20000);
}
// summary 参数预览：按工具类型取关键参数——
// bash→command、read/write/edit→path、grep/find→pattern、dispatch→name、
// web_search→query、其余→首参数 JSON 串；单行化、~100 字符截断溢出省略号。
const ARG_KEY = { bash: "command", read: "path", write: "path", edit: "path",
  grep: "pattern", find: "pattern", dispatch: "name", web_search: "query" };
function argPreview(name, args) {
  if (!args || typeof args !== "object") return "";
  let v = ARG_KEY[name] != null ? args[ARG_KEY[name]] : undefined;
  if (v == null) {                                      // 兜底 = 首参数 JSON 串
    const ks = Object.keys(args);
    if (!ks.length) return "";
    v = args[ks[0]];
  }
  if (typeof v !== "string") v = JSON.stringify(v);
  v = v.replace(/\s+/g, " ").trim();                    // 单行化（命令/路径多行压平）
  return v.length > 100 ? v.slice(0, 100) + "…" : v;
}
function setToolPreview(blk, name, args) { blk.prev.textContent = argPreview(name, args); }
function fmtDur(ms) {
  const s = ms / 1000;
  return (s < 10 ? Math.round(s * 10) / 10 : Math.round(s)) + "s";
}
function setToolDur(blk, ms) { if (ms >= 0) blk.dur.textContent = fmtDur(ms); }
function resultText(res) {
  let txt = "";
  for (const c of (res && res.content) || [])
    if (c && c.type === "text") txt += c.text;
  return trunc(txt.trim(), 50000);                      // 展示截断，防巨型输出卡顿
}

// ---------------- markdown 渲染 + 极简语法高亮 ----------------
function mdDiv(el) {
  // assistant 块内的 markdown 专用子容器：innerHTML 替换不会擦除 thinking/工具子节点
  if (!el._md) {
    const d = document.createElement("div");
    d.className = "mdtext";
    el.appendChild(d);
    el._md = d;
  }

}
function scheduleMdRender() {
  // 流式渐进渲染：150ms 节流，合并 delta 后整段重渲染（仅替换当前消息的 md 子容器）
  if (mdRenderTimer) return;
  mdRenderTimer = setTimeout(() => {
    mdRenderTimer = null;
    if (curAssistantEl && curAssistantBuf)
      renderMarkdownInto(mdDiv(curAssistantEl), curAssistantBuf);

function renderMarkdownInto(el, text) {
  if (!text) return;
  if (window.marked && window.marked.parse) {
    try {
      el.innerHTML = sanitizeHtml(window.marked.parse(text));   // 消毒后再 innerHTML
      el.querySelectorAll("pre code").forEach(highlightCode);
      return;

// ---------------- 极简白名单消毒 ----------------
// w 无内置 sanitizer 且不引外部依赖（单文件零构建约束）→ 原生 DOM 解析 +
// 标签/属性/URL 三重白名单。危险容器（script/style/iframe/svg/form 控件等）连子树整体移除；
// 白名单外普通标签解包保留文本；属性只留 a[href]、img[src|alt] 且 URL 协议白名单。
const SANITIZE_TAGS = new Set(["p", "br", "b", "i", "u", "em", "strong", "code", "pre",
  "blockquote", "ul", "ol", "li", "a", "h1", "h2", "h3", "h4", "h5", "h6",
  "table", "thead", "tbody", "tfoot", "tr", "td", "th", "img", "span", "hr",
  "del", "s", "sup", "sub", "dl", "dt", "dd", "figure", "figcaption"]);
const SANITIZE_DROP = new Set(["script", "style", "iframe", "object", "embed", "form",
  "input", "button", "textarea", "select", "option", "link", "meta", "base",
  "svg", "math", "template", "video", "audio", "source", "track", "frame",
  "frameset", "applet", "dialog"]);
function safeUrl(u) {
  if (typeof u !== "string") return false;
  const v = u.replace(/[\u0000-\u0020]+/g, "").toLowerCase();
  return /^(https?:|mailto:|#|\/|\.\/|\.\.\/)/.test(v);
}
function sanitizeWalk(parent) {
  const nodes = Array.from(parent.childNodes);
  for (const n of nodes) {
    if (n.nodeType === 8) { parent.removeChild(n); continue; }   // 注释移除（条件注释面）
    if (n.nodeType !== 1) continue;                              // 文本保留（已转义序列化）
    const tag = n.tagName.toLowerCase();
    if (SANITIZE_DROP.has(tag)) { parent.removeChild(n); continue; }
    if (!SANITIZE_TAGS.has(tag)) {
      sanitizeWalk(n);                                           // 解包：递归消毒后提升子节点
      while (n.firstChild) parent.insertBefore(n.firstChild, n);
      parent.removeChild(n);
      continue;
    }
    const attrs = Array.from(n.attributes).map(a => a.name);
    for (const a of attrs) {
      const al = a.toLowerCase();
      if (tag === "a" && al === "href" && safeUrl(n.getAttribute(a))) continue;
      if (tag === "img" && al === "src" && safeUrl(n.getAttribute(a))) continue;
      if (tag === "img" && al === "alt") continue;
      n.removeAttribute(a);                                      // 其余全删（含 on* 事件属性）
    }
    sanitizeWalk(n);
  }
}
function sanitizeHtml(html) {
  const tpl = document.createElement("template");                // 惰性文档，不执行脚本/加载资源
  tpl.innerHTML = html;
  sanitizeWalk(tpl.content);
  return tpl.innerHTML;
}
// 极简内嵌高亮：注释/字符串/数字/关键字，单一正则扫描。不引外部库。
const HL_RE = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(\d+(?:\.\d+)?)\b|\b(const|let|var|function|return|if|elif|else|for|while|class|import|from|export|async|await|try|catch|except|finally|def|pass|raise|with|as|in|of|new|typeof|instanceof|switch|case|break|continue|lambda|yield|None|True|False|null|undefined|true|false|then|do|done|fi|esac|echo|exit|local|select|struct|fn|mut|impl|use|public|private|static|void|int|str|string|bool)\b/g;
function highlightCode(codeEl) {
  const src = codeEl.textContent;
  if (!src || src.length > 200000) return;   // 超大块跳过，防卡顿
  let out = "", last = 0, m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? "tok-c" : m[2] ? "tok-s" : m[3] ? "tok-n" : "tok-k";
    out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
    last = m.index + m[0].length;
  }
  out += esc(src.slice(last));
  codeEl.innerHTML = out;
}

// ---------------- dialog 组件（倒计时实时递减） ----------------
function showDialog(o) {
  const id = o.id;
  pendingDialogs[id] = o;
  const box = $("dialogBox");
  if (box.style.display === "block" && box.dataset.did !== String(id)) {
    sysLine("⚠ Another dialog queued [" + (o.method || "?") + "] id=" + id, "warn");
    return;
  }
  showDialogNow(o);
}
function showDialogNow(o) {
  const id = o.id;
  const box = $("dialogBox");
  box.dataset.did = String(id);
  box.style.display = "block";
  $("dialogMethod").textContent = "dialog [" + (o.method || "?") + "] id=" + id;
  $("dialogTitle").textContent = o.title || o.message || "(untitled)";
  const opts = $("dialogOpts");
  opts.innerHTML = "";
  const input = $("dialogInput");
  const m = o.method;
  if (m === "select" && Array.isArray(o.options)) {
    input.classList.add("hidden");
    for (const op of o.options) {
      const b = document.createElement("button");
      b.textContent = op;
      b.onclick = () => replyDialog({value: op});
      opts.appendChild(b);
    }
  } else if (m === "confirm") {
    input.classList.add("hidden");
    const y = document.createElement("button");
    y.textContent = "Confirm"; y.className = "primary";
    y.onclick = () => replyDialog({confirmed: true});
    const n = document.createElement("button");
    n.textContent = "Reject";
    n.onclick = () => replyDialog({confirmed: false});
    opts.appendChild(y); opts.appendChild(n);
  } else { // input / editor / 未知
    input.classList.remove("hidden");
    input.value = o.defaultValue || o.value || "";
    input.onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault();
        replyDialog({value: input.value}); }
    };
    const b = document.createElement("button");
    b.textContent = "Submit"; b.className = "primary";

function startDialogCountdown(timeoutMs) {
  stopDialogCountdown();

  if (!timeoutMs) { el.textContent = ""; return; }
  dialogDeadline = Date.now() + timeoutMs;
  const tick = () => {
    const remain = Math.max(0, Math.ceil((dialogDeadline - Date.now()) / 1000));
    el.textContent = "Auto-settle in " + remain + "s";
    if (remain <= 0) stopDialogCountdown();

}
function stopDialogCountdown() {

}
async function replyDialog(fields) {

  try {
    await api("cmd", {session: attached, cmd: JSON.stringify(cmd)});
    closeDialog(id, "answered");

    // 0830-1104-eji4：服务端报错（如 'no pending dialog'）= 对端已结算，
    // 本地关框才是正确语义；原来只在 try 内关框 → 非应答端 Cancel 永久卡死。
    sysLine("Dialog reply failed: " + e.message + " — closing locally (already settled)", "err");

// ---------------- QUEUED 面板（任务 0829-2115-zvti 本地视图 → 0829-2131-pdop 权威接入） ----------------
// 数据源 = queue_update 事件（后端权威：steering + followUp 分组）；本地待发记录
// （pendingSends，steer/queue 送出后、对应 user message 事件到达前）退化为发送瞬间的
// 乐观补位：仅当同文本尚不在后端队列里时显示，避免与权威条目重复。
// 观感按 pi-web QUEUED 口径（见上方 CSS 注释）；无 Recall to input 按钮：
// pi rpc 协议（steer/follow_up）无清除/召回队列的命令，不提供。
function renderQueuedPanel() {
  const panel = $("queuedPanel");
  panel.innerHTML = "";
  const items = [];
  for (const s of queueState.steering) items.push({kind: "steer", text: s});
  for (const f of queueState.followUp) items.push({kind: "fu", text: f});
  const seen = new Set(items.map(i => i.text));
  for (const k of Object.keys(pendingSends)) {
    const p = pendingSends[k];
    if (p.mode === "prompt") continue;                    // prompt 直发不是排队条目，不进面板（0830-1029-urgg）
    if (seen.has(p.text)) continue;                       // 后端已收编 → 不重复展示（去重）
    items.push({kind: p.mode === "steer" ? "steer" : "fu", text: p.text,
                rejected: p.rejected, local: true});
    seen.add(p.text);
  }
  if (!items.length) { panel.classList.add("hidden"); return; }
  panel.classList.remove("hidden");
  const head = document.createElement("div");
  head.className = "qp-head";
  head.textContent = "QUEUED \u00b7 " + items.length;      // steer + follow-up 混合计数（含两者，0829-2131-pdop inbox s3p2）
  panel.appendChild(head);
  for (const p of items) {
    const it = document.createElement("div");
    it.className = "qp-item" + (p.rejected ? " rejected" : "");
    const badge = document.createElement("span");
    badge.className = "qp-badge " + (p.kind === "steer" ? "steer" : "fu");
    badge.textContent = p.kind === "steer" ? "steer" : "follow-up";
    const txt = document.createElement("span");
    txt.className = "qp-text";
    txt.textContent = p.text;                             // CSS 单行截断省略号，title 存全文摘要（0829-2131-pdop）
    txt.title = p.rejected ? "Send rejected/failed (see notice)"
      : p.kind === "steer"
        ? "Queued: delivered after the current tool finishes, before the next model call"
        : "Pending: delivered only after the agent fully stops";
    it.appendChild(badge); it.appendChild(txt);
    panel.appendChild(it);
  }
}
function addPendingSend(id, text, mode) {
  pendingSends[id] = {mode: mode, text: text, rejected: false};
  renderQueuedPanel();
  scrollStream();
}
function resolvePendingByMessage(m) {
  // 送达信号 = 对应 user message 事件：文本相等即认领（模板展开等极端失配时降级为普通渲染）
  const txt = msgText(m);
  for (const id of Object.keys(pendingSends)) {

// ---------------- 上行命令回执（response 事件，任务 0829-2115-zvti） ----------------
// pi rpc 对 prompt/steer/follow_up 均有 {type:"response", id, command, success} 回执，
// 经事件环送达。被拒 → 显式 flash，不静默；仅 prompt 被 "already processing" 拒时
// 自动转 follow_up 重发（兜底竞态，0830-1029-urgg）。
function handleCmdResponse(o) {
  if (o.command === "get_state") {            // get_state 回执：权威模型/思考强度（0830-1257-vwzb）
    getStateInFlight = false;
    if (o.success && o.data) {                // 失败静默忽略（不闪 err）
      const m = o.data.model || {};
      curProvider = m.provider || curProvider;
      curModelId = m.modelId || m.id || curModelId;
      curThinkingLevel = o.data.thinkingLevel || curThinkingLevel;
      if (typeof o.data.messageCount === "number") curMsgCount = o.data.messageCount;  // inbox 增项：零额外请求自带
      curCompacting = !!o.data.isCompacting;
      refreshSlashNoticeIfVisible();
    }
    return;
  }
  if (o.command === "get_session_stats") {     // 上下文占用回执（0830-1324-3qet）
    ctxStatsInFlight = false;
    if (o.success && o.data) {                // 失败静默忽略（不闪 err）
      curCtx = o.data.contextUsage || null;
      refreshSlashNoticeIfVisible();
    }
    return;
  }
  if (typeof o.id !== "string" || !(o.id in pendingSends)) return;
  const p = pendingSends[o.id];
  if (o.success) return;                       // 已入队：面板条目保留，等送达移除
  const err = o.error || o.message || "rejected";
  // 兜底竞态（0830-1029-urgg）：prompt 直发被 "already processing" 拒绝 = 空闲判定与
  // agent 启动同瞬相撞 → 不标 rejected / 不闪 err，自动转 follow_up 重发入队。
  // images 无法从 pending 恢复，仅重发文本（极端情况可接受）。
  if (p.mode !== "queue" && /already processing/i.test(err)) {
    delete pendingSends[o.id];
    const nid = uid();
    addPendingSend(nid, p.text, "queue");
    sendTracked({type: "follow_up", message: p.text, id: nid});
    flash("Agent busy → queued as follow-up", "warn");
    return;
  }
  flash("Send rejected (" + (o.command || p.mode) + "): " + err, "err");
  p.rejected = true;
  renderQueuedPanel();
}

// 带发送跟踪的上行：HTTP 层失败时同步标错队列面板条目（sendCmd 的加强版）
async function sendTracked(cmd) {
  if (!attached) { sysLine("Not attached to a session", "err"); return; }
  try { await api("cmd", {session: attached, cmd: JSON.stringify(cmd)}); }
  catch (e) {
    sysLine("Send failed: " + e.message, "err");
    const p = pendingSends[cmd.id];
    if (p) { p.rejected = true; renderQueuedPanel(); }
  }
}

// ---------------- 斜杠命令拦截 ----------------
// 以 / 开头的输入不进 prompt：可映射 pi rpc 命令的做真实现，其余内联提示。
const THINKING_LEVELS = ["off", "minimal", "low", "medium", "high", "xhigh", "max"];
const SLASH_HELP = "Session commands: /abort · /clear · /compact · /model <provider>/<modelId> · "
  + "/thinking <" + THINKING_LEVELS.join("|") + "> · /export · /fork [<entryId>]"
  + " · /image · /reload · /sound [on|off]";
let noticeTimer = null;
let slashNoticeOn = false;    // 当前粘性展示的是斜杠命令提示（0830-1257-vwzb，供 get_state 回执定点刷新）
function showNotice(text, cls, sticky) {

  const n = $("slashNotice");
  n.textContent = text;
  n.className = "notice" + (cls ? " " + cls : "");   // 清掉 hidden，可附 err 色
  if (noticeTimer) { clearTimeout(noticeTimer); noticeTimer = null; }
  if (!sticky) noticeTimer = setTimeout(hideNotice, 6000);
}
function hideNotice() {
  if (noticeTimer) { clearTimeout(noticeTimer); noticeTimer = null; }

  $("slashNotice").classList.add("hidden");
}
// 斜杠提示 = 两行状态 + 命令表（任务 0830-1257-vwzb，多行口径见 inbox m2vt）：
// 行 1 = model + thinking；行 2 = msgs/gen/restarts（isCompacting=true 时行尾追标）；
// SLASH_HELP 另起一行；任一值缺失显示 ?。.notice 自带 pre-wrap，\n 直接换行。
// 上下文占用行（0830-1324-3qet）：数据源 = get_session_stats 的 contextUsage
// {tokens, contextWindow, percent}（pi 权威值，含系统提示+工具开销，不做客户端估算）。
// k 格式化复用 fmtThinkingCount；percent 取整。tokens=null（compaction 后未响应前）
// → "ctx≈? / <window>k"；curCtx 全空 → "ctx≈?"。
function ctxStatusText() {
  if (!curCtx) return "ctx\u2248?";
  const wTxt = (typeof curCtx.contextWindow === "number") ? fmtThinkingCount(curCtx.contextWindow) : "?";
  const t = curCtx.tokens;
  if (t == null) return "ctx\u2248? / " + wTxt;
  const pTxt = (typeof curCtx.percent === "number") ? Math.round(curCtx.percent) : "?";
  return "ctx\u2248" + fmtThinkingCount(t) + " / " + wTxt
    + " tok\uff08" + pTxt + "%\uff09";
}
function slashStatusLine() {
  const l1 = "model: " + (curProvider || "?") + "/" + (curModelId || "?")
    + " \u00b7 thinking: " + (curThinkingLevel || "?");
  let l2 = "msgs: " + (curMsgCount == null ? "?" : curMsgCount)
    + " \u00b7 gen: " + (curGen == null ? "?" : curGen)
    + " \u00b7 restarts: " + (curRestarts == null ? "?" : curRestarts);
  if (curCompacting) l2 += " \u00b7 compacting\u2026";
  return l1 + "\n" + l2 + "\n" + ctxStatusText();
}
function showSlashNotice() {
  showNotice(slashStatusLine() + "\n" + SLASH_HELP, "", true);
  slashNoticeOn = true;
}
function refreshSlashNoticeIfVisible() {

}
function handleSlash(msg) {
  const sp = msg.indexOf(" ");
  const cmd = (sp < 0 ? msg : msg.slice(0, sp)).toLowerCase();
  const arg = sp < 0 ? "" : msg.slice(sp + 1).trim();
  switch (cmd) {
    case "/abort":
      sendCmd({type: "abort", id: uid()});
      // 0830-0956-vk20 bug1：后端对悬空 dialog 同步发 cancelled 代答，前端同步
      // 关闭本地 dialog 盒子，保持一致。
      clearPendingDialogs();
      showNotice("Abort sent (waits for the current generation/tool to stop)"); return;
    case "/clear":
      doClear(); return;
    case "/compact":
      sendCmd({type: "compact", id: uid(), ...(arg ? {customInstructions: arg} : {})});
      showNotice("Compaction requested…"); return;
    case "/model": {
      if (!arg) { showNotice("Usage: /model <provider>/<modelId>", "err"); return; }
      const i = arg.indexOf("/");
      const provider = i > 0 ? arg.slice(0, i) : curProvider;
      const modelId = i > 0 ? arg.slice(i + 1) : arg;
      if (!provider || !modelId) {
        showNotice("Usage: /model <provider>/<modelId> (current provider unknown — write the full form)", "err");
        return;
      }
      sendCmd({type: "set_model", provider: provider, modelId: modelId, id: uid()});
      showNotice("Model switch requested → " + provider + "/" + modelId); return;
    }
    case "/thinking":
      if (THINKING_LEVELS.indexOf(arg) < 0) {
        showNotice("Usage: /thinking <" + THINKING_LEVELS.join("|") + ">", "err"); return;
      }
      sendCmd({type: "set_thinking_level", level: arg, id: uid()});
      showNotice("Thinking level requested → " + arg); return;
    case "/export":
      sendCmd({type: "export_html", id: uid(), ...(arg ? {outputPath: arg} : {})});
      showNotice("HTML export requested (defaults to the session working dir)…"); return;
    case "/fork": {
      const entryId = arg || curLeafId;
      if (!entryId) {
        showNotice("Usage: /fork <entryId> (no leaf entry available)", "err"); return;
      }
      sendCmd({type: "fork", entryId: entryId, id: uid()});
      showNotice("Fork requested @ " + entryId); return;
    }
    case "/image":
      // 任务 0830-1139-yao1：手机上粘贴取图别扭，低频场景用命令唤起系统文件选择器。
      // 必须在本同步调用链内触发 input.click()（见 pickImages 注释）。
      pickImages(); return;
    case "/reload":
      doReload(); return;
    case "/sound": {
      // 提示音开关（任务 0829-2103-dpe4）：无参切换，默认开；无图形控件。
      if (!arg) soundOn = !soundOn;
      else if (arg === "on") soundOn = true;
      else if (arg === "off") soundOn = false;
      else { showNotice("Usage: /sound [on|off]", "err"); return; }
      showNotice("Sound: " + (soundOn ? "on" : "off"));
      if (soundOn) beep("notify");            // 响一声确认（未解锁则静默）
      return;
    }
    default:
      showNotice("Unknown command " + cmd + " — " + SLASH_HELP, "err"); return;
  }
}

// ---------------- 粘贴取图 + 待发送附件条（任务 0829-2103-8etk） ----------------
// paste 事件只拦 image 类型项；文本/文件等非图片粘贴不 preventDefault，行为不变。
$("promptInput").addEventListener("paste", e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  let got = false;
  for (const it of items) {
    if (it.kind !== "file" || !(it.type || "").startsWith("image/")) continue;
    const f = it.getAsFile();
    if (!f) continue;
    got = true;
    const mime = it.type, reader = new FileReader();
    reader.onload = () => {
      const url = String(reader.result || "");
      const i = url.indexOf(",");
      if (i < 0) return;
      pendingImages.push({mime: mime, b64: url.slice(i + 1), dataUrl: url});
      renderAttachBar();
    };
    reader.readAsDataURL(f);
  }
  if (got) e.preventDefault();
});
// /image 命令（任务 0830-1139-yao1）：动态创建隐藏 file input 并程序化 click()，
// 唤起系统文件选择器（手机弹相册/文件）。浏览器安全策略要求 click() 处于用户手势的
// 同步调用链内：Enter → sendPrompt → handleSlash → pickImages，中途无 await，合法。
// 读取逻辑与粘贴取图同构：{mime, b64, dataUrl} push 进 pendingImages + renderAttachBar。
function pickImages() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
  inp.style.display = "none";
  inp.onchange = () => {
    Array.from(inp.files || []).forEach(f => {
      if (!(f.type || "").startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = () => {
        const url = String(reader.result || "");
        const i = url.indexOf(",");
        if (i < 0) return;
        pendingImages.push({mime: f.type, b64: url.slice(i + 1), dataUrl: url});
        renderAttachBar();
      };
      reader.readAsDataURL(f);
    });
    inp.remove();                                    // 用完即移除，避免重复触发/泄漏
  };
  inp.oncancel = () => inp.remove();                 // 用户取消也回收（现代浏览器支持）
  document.body.appendChild(inp);
  inp.click();                                       // 同步触发，处于用户手势链内
}
function renderAttachBar() {
  const bar = $("attachBar");
  bar.innerHTML = "";
  if (!pendingImages.length) { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  pendingImages.forEach((a, idx) => {
    const t = document.createElement("span");
    t.className = "attach-thumb";
    const img = document.createElement("img");
    img.src = a.dataUrl; img.alt = a.mime;
    t.appendChild(img);
    const rm = document.createElement("button");
    rm.className = "rm"; rm.textContent = "×"; rm.title = "Remove this image";
    rm.onclick = () => { pendingImages.splice(idx, 1); renderAttachBar(); };
    t.appendChild(rm);
    bar.appendChild(t);
  });
  const clr = document.createElement("button");
  clr.className = "clear-all"; clr.textContent = "Clear (" + pendingImages.length + ")";
  clr.onclick = () => { pendingImages = []; renderAttachBar(); };
  bar.appendChild(clr);
}

// ---------------- 用户消息渲染（文本 + 图片缩略图；流式与基线共用） ----------------
function renderUserMessage(m) {
  turnGroup = null;                             // 回合起点 → turn 组重置（基线/实时共用此入口，0830-1047-ehzc）
  const txt = msgText(m);
  const imgs = (Array.isArray(m.content) ? m.content : [])
    .filter(p => p && p.type === "image" && p.data && p.mimeType);
  if (!txt && !imgs.length) return;
  const d = addDiv("role-user", txt);
  for (const p of imgs) {
    const a = document.createElement("a");
    a.className = "msg-img-link";
    a.href = "data:" + p.mimeType + ";base64," + p.data;
    a.target = "_blank"; a.rel = "noopener";
    // Chrome 禁止新标签页直接导航 data: URL → 点击时转 blob URL 打开原图
    a.onclick = ev => { ev.preventDefault();
      window.open(dataToBlobUrl(p.data, p.mimeType), "_blank", "noopener"); };
    const img = document.createElement("img");
    img.className = "msg-img";
    img.src = a.href; img.alt = "image";
    a.appendChild(img);
    d.appendChild(a);
  }
}
function dataToBlobUrl(b64, mime) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([u8], {type: mime}));
}

// IME 组合保护：组合期间 Enter 只确认候选字，不发送；
// 部分浏览器（Chrome）compositionend 后仍会再派发一次 Enter keydown → 用标志位
// 延迟一拍清除吞掉它。
let composing = false;
$("promptInput").addEventListener("compositionstart", () => { composing = true; });
$("promptInput").addEventListener("compositionend", () => {
  setTimeout(() => { composing = false; }, 0);
});
$("promptInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    if (e.isComposing || e.keyCode === 229 || composing) return;
    e.preventDefault(); sendPrompt();
  }
});
$("promptInput").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
  // / 补全提示（简版）：输入以 / 开头时粘性展示支持表；非 / 开头清掉提示
  if (this.value.trimStart().startsWith("/")) { showSlashNotice(); sendGetState(); sendStatusQuery(); sendCtxStats(); }  // 0830-1257-vwzb：状态行 + 命令表，并拉权威值回填；0830-1324-3qet：上下文占用
  else hideNotice();
});

// ---------------- 小工具 ----------------
function addDiv(cls, text) {
  const d = document.createElement("div");
  d.className = "ev " + cls;
  if (text) d.appendChild(document.createTextNode(text));
  $("stream").appendChild(d);
  scrollStream();
  return d;
}
function sysLine(text, cls) {
  // 前端自生成的提示（挂接/自愈/错误等）经 flash 轻提示承载，错误不静默吞掉
  flash(text, cls);
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;",
    ">": "&gt;", '"': "&quot;"}[c]));
}
function trunc(s, n) { s = String(s); return s.length <= n ? s : s.slice(0, n) + "…"; }
function msgText(m) {
  const c = m.content;
  if (typeof c === "string") return c;
  if (Array.isArray(c))
    return c.filter(p => p && p.type === "text").map(p => p.text || "").join("\n");
  return "";
}
function scrollStream() { const el = $("stream"); el.scrollTop = el.scrollHeight; }

// ---------------- 手机软键盘高度适配（任务 0830-1142-tx6v） ----------------
// iOS Safari 不支持 interactive-widget=resizes-content（键盘弹出为覆盖而非收缩），
// 用 visualViewport 兜底：键盘弹出时把 .layout 高度压到可见高度，输入框保持可见。
// 幂等：每次 resize 事件重算，只写 inline style.height；键盘收起/桌面窗口 resize 时
// vv.height ≈ window.innerHeight（差值 < 120px）→ 清掉 inline 高度，回到 CSS 的
// dvh/vh 原逻辑，桌面行为不受影响。Android Chrome 已由 meta resizes-content 收缩，
// 此处逻辑同构叠加（二者给出相同高度，无冲突）。
(function () {
  const vv = window.visualViewport;
  if (!vv) return;                                    // 极老浏览器：保持 CSS 行为，不报错
  const layout = document.querySelector(".layout");
  if (!layout) return;
  const fit = () => {
    const h = vv.height;
    if (window.innerHeight - h < 120) {               // 无键盘：恢复 CSS 高度（桌面/收起态）
      if (layout.style.height) layout.style.height = "";
    } else {                                          // 键盘弹出：压到可见高度
      layout.style.height = h + "px";
      scrollStream();                                 // 最新消息回到视野（幂等）
    }
  };
  vv.addEventListener("resize", fit);
})();

// ---------------- 启动：加载即按 URL 挂接对应会话 ----------------
if (SESSION) {
  // 双宿主盲区警示（任务 0829-2052-rnfe）：/agents/ 下的 .jsonl 可能是其它机制以
  // pi --session 打开的活跃会话（如子任务会话）；8080 的 SESSIOND_SESSION_FILE
  // 识别域看不见外部宿主，继续操作可能对同一文件再起进程。只警告不拦截。
  if (SESSION.split("/").includes("agents")) {
    flash("⚠ This session lives under /agents/ and may be an active session owned by "
      + "another host (e.g. a subtask). 8080 cannot see external hosts; continuing may "
      + "double-host the same session file — proceed with care.", "err");
  }
  attach(SESSION);
} else {
  sysLine("No session recognized: open /<site-path>.jsonl?v=chat (current: "
    + location.pathname + ")", "err");
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sessiond web</title>
<script type="application/javascript" src="/w/ext/markdown/deps/marked.min.js"></script>
<style>
:root {
  --bg: #0f1216; --panel: #171c23; --panel2: #1e2530; --fg: #d7dee8;
  --dim: #7d8a9c; --acc: #4da3ff; --ok: #3fbf6f; --warn: #e0b13f;
  --err: #e35d5d; --line: #2a3340;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5; }
header b { color: var(--acc); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
.dot.on { background: var(--ok); } .dot.err { background: var(--err); }
#connInfo { color: var(--dim); font-size: 12px; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
button:hover { border-color: var(--acc); }
button.primary { background: var(--acc); border-color: var(--acc); color: #08111d; }
.layout { display: flex; height: calc(100vh - 41px); }
aside { width: 300px; min-width: 220px; border-right: 1px solid var(--line);
  overflow-y: auto; background: var(--panel); }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.sess { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.sess:hover, .sess.cur { background: var(--panel2); }
.sess .name { font-weight: 600; }
.sess .meta { color: var(--dim); font-size: 12px; }
.badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px;
  border: 1px solid var(--line); color: var(--dim); margin-left: 4px; }
.badge.run { color: var(--ok); border-color: var(--ok); }
.badge.off { color: var(--dim); } .badge.dis { color: var(--err); border-color: var(--err); }
aside h3 { margin: 10px 12px 4px; font-size: 12px; color: var(--dim);
  text-transform: uppercase; letter-spacing: .08em; }
#stream { flex: 1; overflow-y: auto; padding: 12px 16px; }
.ev { margin-bottom: 8px; }
.role-user { background: var(--panel2); border-left: 3px solid var(--acc);
  padding: 6px 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
.md { word-break: break-word; }
.md p { margin: 4px 0; }
.md pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px; overflow-x: auto; font-size: 12px; }
.md code { background: var(--panel); padding: 1px 4px; border-radius: 4px;
  font-size: 12px; }
.md pre code { background: none; padding: 0; }
.thinking { color: var(--dim); font-style: italic; }
.sys { color: var(--dim); font-size: 12px; }
.sys.warn { color: var(--warn); } .sys.err { color: var(--err); }
.tool { color: var(--dim); font-size: 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px;
  margin: 2px 0; word-break: break-all; }
.tool .tname { color: var(--warn); }
.tool.done .tname { color: var(--ok); } .tool.fail .tname { color: var(--err); }
details.raw summary { color: var(--dim); font-size: 12px; cursor: pointer; }
details.raw pre { font-size: 11px; color: var(--dim); white-space: pre-wrap;
  word-break: break-all; margin: 2px 0; }
#inputbar { display: flex; gap: 8px; padding: 10px 16px;
  border-top: 1px solid var(--line); background: var(--panel); }
#promptInput { flex: 1; background: var(--panel2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  font: inherit; resize: none; max-height: 120px; }
#promptInput:focus { outline: none; border-color: var(--acc); }
#dialogBox { position: fixed; right: 18px; bottom: 80px; width: 380px;
  max-width: 90vw; background: var(--panel2); border: 1px solid var(--warn);
  border-radius: 10px; padding: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.5);
  display: none; z-index: 10; }
#dialogBox h4 { margin: 0 0 6px; color: var(--warn); }
#dialogTitle { white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; }
#dialogOpts { display: flex; flex-direction: column; gap: 6px; }
#dialogOpts button { text-align: left; }
#dialogInput { width: 100%; background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  margin-bottom: 8px; font: inherit; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <b>sessiond</b>
  <span class="dot" id="connDot"></span>
  <span id="connInfo">未挂接</span>
  <button onclick="refreshStatus()">刷新</button>
  <button onclick="detach()">断开挂接</button>
</header>
<div class="layout">
  <aside>
    <h3>会话</h3>
    <div id="sessList"></div>
  </aside>
  <main>
    <div id="stream"></div>
    <div id="inputbar">
      <textarea id="promptInput" rows="1" placeholder="输入 prompt，Enter 发送（Shift+Enter 换行）"></textarea>
      <button onclick="sendAbort()">中止</button>
      <button onclick="sendGetState()">get_state</button>
      <button class="primary" onclick="sendPrompt()">发送</button>
    </div>
  </main>
</div>

<div id="dialogBox">
  <h4 id="dialogMethod">dialog</h4>
  <div id="dialogTitle"></div>
  <input id="dialogInput" class="hidden" placeholder="输入…">
  <div id="dialogOpts"></div>
  <div style="margin-top:8px; display:flex; gap:8px;">
    <button id="dialogCancel" onclick="replyDialog({cancelled:true})">取消</button>
    <span id="dialogTimeout" class="sys" style="align-self:center"></span>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const API = "/sessiond/rpc/api.py";
const STREAM = "/sessiond/rpc/stream.py";
let attached = null;          // 当前挂接会话名
let statusTimer = null;
let uidSeq = 0;
const uid = () => "web-" + (++uidSeq) + "-" + Date.now().toString(36);
let pendingDialogs = {};      // id -> request
let curAssistantEl = null;    // 当前 assistant 消息渲染节点
let curAssistantBuf = "";     // 累积文本（用于 message_end 时 markdown 渲染）
// 流状态
let streamCtrl = null;        // AbortController
let lastSeq = 0;              // SSE id 游标（重连补齐用）
let streamAlive = false;
let reconnectTimer = null;

// ---------------- 基础请求 ----------------
async function api(op, extra) {
  const body = new URLSearchParams(Object.assign({op: op}, extra || {}));
  const r = await fetch(API, {method: "POST", credentials: "same-origin",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: body.toString()});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("" + r.status));
  return j;
}

// ---------------- 会话列表 ----------------
async function refreshStatus() {
  let st;
  try { st = await api("status"); } catch (e) {
    $("sessList").innerHTML = '<div class="sess"><div class="meta">status 失败: ' + esc(e.message) + "</div></div>";
    return;
  }
  const el = $("sessList");
  el.innerHTML = "";
  for (const s of (st.sessions || [])) {
    const d = document.createElement("div");
    d.className = "sess" + (s.name === attached ? " cur" : "");
    const badge = s.disabled ? '<span class="badge dis">熔断</span>'
      : s.state === "running" ? '<span class="badge run">running</span>'
      : '<span class="badge off">' + esc(s.state || "?") + "</span>";
    const en = s.enabled ? "" : '<span class="badge off">disabled</span>';
    d.innerHTML = '<div class="name">' + esc(s.name) + badge + en + "</div>"
      + '<div class="meta">gen=' + nz(s.gen) + " · restarts=" + nz(s.restarts)
      + " · clients=" + nz(s.clients) + (s.pid ? " · pid=" + s.pid : "") + "</div>";
    d.onclick = () => attach(s.name);
    el.appendChild(d);
  }
  if (!(st.sessions || []).length)
    el.innerHTML = '<div class="sess"><div class="meta">注册表为空</div></div>';
}
function nz(x) { return (x === null || x === undefined) ? "?" : x; }

// ---------------- 挂接与事件流 ----------------
async function attach(name) {
  if (attached === name && streamAlive) return;
  stopStream();
  clearPendingDialogs();
  $("stream").innerHTML = "";
  curAssistantEl = null; curAssistantBuf = "";
  try { await api("attach", {session: name}); }
  catch (e) { sysLine("挂接失败: " + e.message, "err"); return; }
  attached = name;
  lastSeq = 0;
  openStream();
  refreshStatus();
}

function stopStream() {
  streamAlive = false;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (streamCtrl) { try { streamCtrl.abort(); } catch (e) {} streamCtrl = null; }
  setConn(false, "未挂接");
}

function openStream() {
  streamAlive = true;
  setConn(false, "连接中… " + attached);
  streamCtrl = new AbortController();
  const url = STREAM + "?session=" + encodeURIComponent(attached) + "&since=" + lastSeq;
  fetch(url, {credentials: "same-origin", signal: streamCtrl.signal})
    .then(resp => {
      if (!resp.ok) throw new Error("stream " + resp.status);
      setConn(true, attached);
      const reader = resp.body.getReader();
      const dec = new TextDecoder("utf-8");
      let buf = "";
      const pump = () => reader.read().then(r => {
        if (!streamAlive) return;
        if (r.done) { throw new Error("stream ended"); }
        buf += dec.decode(r.value, {stream: true});
        buf = drainFrames(buf);
        return pump();
      });
      return pump();
    })
    .catch(e => {
      if (!streamAlive) return;           // 主动断开，不重连
      setConn(false, attached + "（重连中）");
      reconnectTimer = setTimeout(openStream, 1500);
    });
}

// 解析 SSE 帧（id:/data:），返回未消费完的剩余缓冲
function drainFrames(buf) {
  let idx;
  while ((idx = buf.indexOf("\n\n")) >= 0) {
    const frame = buf.slice(0, idx);
    buf = buf.slice(idx + 2);
    let id = null, data = null;
    for (const line of frame.split("\n")) {
      if (line.startsWith("id:")) id = parseInt(line.slice(3).trim(), 10);
      else if (line.startsWith("data:")) data = line.slice(5).trim();
    }
    if (data === null) continue;          // 注释/keep-alive
    if (id !== null && !isNaN(id)) lastSeq = id;
    let obj; try { obj = JSON.parse(data); } catch (e) { continue; }
    handleEvent(obj);
  }
  return buf;
}

function setConn(on, info) {
  $("connDot").className = "dot" + (on ? " on" : " err");
  $("connInfo").textContent = info;
}

async function detach() {
  if (!attached) return;
  stopStream();
  try { await api("detach", {session: attached}); } catch (e) {}
  attached = null;
  $("stream").innerHTML = "";
  refreshStatus();
}

// ---------------- 事件渲染 ----------------
function handleEvent(o) {
  const t = o.type;
  if (t === "sessiond.hello") {
    setConn(true, o.session + " · state=" + o.state + " · gen=" + o.gen
      + " · pid=" + o.pid + (o.replay_count ? " · replay=" + o.replay_count : ""));
    sysLine("挂接 " + o.session + "（state=" + o.state + ", gen=" + o.gen
      + ", 回放 " + (o.replay_count || 0) + " 行）");
    return;
  }
  if (t === "sessiond.replay") {
    if (o.line && typeof o.line === "object") renderEvent(o.line);
    return;
  }
  if (t === "sessiond.replay_end") { sysLine("回放结束"); return; }
  if (t === "sessiond.error") { sysLine("sessiond: " + o.message, "err"); return; }
  if (t === "sessiond.session_restarting") {
    sysLine("会话进程死亡，" + (o.delay || 0) + "s 后重启", "warn"); return;
  }
  if (t === "sessiond.session_restarted") {
    sysLine("会话已重启（gen=" + o.gen + ", pid=" + o.pid + "）", "warn"); return;
  }
  if (t === "sessiond.session_disabled") { sysLine("会话崩溃熔断", "err"); return; }
  if (t === "sessiond.dialog_resolved") {
    if (pendingDialogs[o.id]) closeDialog(o.id, "已由 " + o.by + " 应答");
    return;
  }
  if (t === "sessiond.pong") return;
  if (t === "webgw.bridge_lost") {
    sysLine("网关与会话后端断开（守护重启？）— 自动重连后将回放补齐", "warn");
    return;
  }
  renderEvent(o);
}

function renderEvent(o) {
  const t = o.type;
  if (t === "message_start") {
    const m = o.message || {};
    if (m.role === "user") {
      const txt = msgText(m);
      if (txt) addDiv("role-user", txt);
      curAssistantEl = null; curAssistantBuf = "";
    } else if (m.role === "assistant") {
      curAssistantEl = addDiv("role-assistant md", "");
      curAssistantBuf = "";
    }
    return;
  }
  if (t === "message_update") {
    const ev = o.assistantMessageEvent || {};
    if (!curAssistantEl) { curAssistantEl = addDiv("role-assistant md", ""); curAssistantBuf = ""; }
    if (ev.type === "text_delta") {
      curAssistantBuf += ev.delta || "";
      liveText(curAssistantEl, curAssistantBuf);
    } else if (ev.type === "thinking_delta") {
      let th = curAssistantEl.querySelector(".thinking");
      if (!th) { th = document.createElement("div"); th.className = "thinking";
        curAssistantEl.appendChild(th); }
      th.textContent += ev.delta || "";
    } else if (ev.type === "toolcall_end") {
      const tc = ev.toolCall || {};
      toolLine("⇢ " + (tc.name || "?"), tc.arguments, "");
    }
    scrollStream();
    return;
  }
  if (t === "message_end") {
    const m = o.message || {};
    if (m.role === "assistant" && curAssistantEl) {
      const txt = curAssistantBuf || msgText(m);
      renderMarkdownInto(curAssistantEl, txt);
    }
    curAssistantEl = null; curAssistantBuf = "";
    return;
  }
  if (t === "tool_execution_start") { toolLine("🔧 " + (o.toolName || "?"), o.args, "…"); return; }
  if (t === "tool_execution_end") {
    const res = o.result || {};
    let txt = "";
    for (const c of res.content || []) if (c && c.type === "text") txt += c.text;
    toolLine((o.isError ? "✗ " : "✓ ") + (o.toolName || "?") + " done",
             null, trunc(txt.trim(), 300), o.isError ? "fail" : "done");
    return;
  }
  if (t === "extension_ui_request") { showDialog(o); return; }
  if (t === "response") {
    sysLine("← " + (o.command || "?") + (o.success ? " ok" : " FAIL"
      + (o.error ? " — " + trunc(o.error, 200) : "")), o.success ? "" : "err");
    return;
  }
  if (t === "agent_start") { sysLine("── agent start ──"); return; }
  if (t === "agent_end") { sysLine("── agent end (willRetry=" + o.willRetry + ") ──"); return; }
  if (t === "agent_settled") { sysLine("── settled ──"); return; }
  if (t === "turn_start" || t === "turn_end") { sysLine("── " + t + " ──"); return; }
  if (t === "queue_update") {
    sysLine("queue: steer=" + JSON.stringify(o.steering)
      + " followUp=" + JSON.stringify(o.followUp));
    return;
  }
  const d = document.createElement("details");
  d.className = "raw";
  d.innerHTML = "<summary>" + esc(t || "?") + "</summary><pre>"
    + esc(JSON.stringify(o)) + "</pre>";
  $("stream").appendChild(d);
  scrollStream();
}

// ---------------- markdown 渲染（复用 w 已内置的 marked） ----------------
function liveText(el, text) {
  // 流式期间先纯文本渲染，避免每帧跑 markdown；message_end 再整段 markdown
  if (!el._plain) { el._plain = document.createElement("div"); el.appendChild(el._plain); }
  el._plain.textContent = text;
}
function renderMarkdownInto(el, text) {
  if (!text) return;
  if (window.marked && window.marked.parse) {
    try { el.innerHTML = window.marked.parse(text); return; } catch (e) {}
  }
  el.textContent = text;
}

// ---------------- dialog 组件 ----------------
function showDialog(o) {
  const id = o.id;
  pendingDialogs[id] = o;
  const box = $("dialogBox");
  if (box.style.display === "block" && box.dataset.did !== String(id)) {
    sysLine("⚠ 又一 dialog 排队 [" + (o.method || "?") + "] id=" + id, "warn");
    return;
  }
  showDialogNow(o);
}
function showDialogNow(o) {
  const id = o.id;
  const box = $("dialogBox");
  box.dataset.did = String(id);
  box.style.display = "block";
  $("dialogMethod").textContent = "dialog [" + (o.method || "?") + "] id=" + id;
  $("dialogTitle").textContent = o.title || o.message || "(无标题)";
  const opts = $("dialogOpts");
  opts.innerHTML = "";
  const input = $("dialogInput");
  const m = o.method;
  if (m === "select" && Array.isArray(o.options)) {
    input.classList.add("hidden");
    for (const op of o.options) {
      const b = document.createElement("button");
      b.textContent = op;
      b.onclick = () => replyDialog({value: op});
      opts.appendChild(b);
    }
  } else if (m === "confirm") {
    input.classList.add("hidden");
    const y = document.createElement("button");
    y.textContent = "确认"; y.className = "primary";
    y.onclick = () => replyDialog({confirmed: true});
    const n = document.createElement("button");
    n.textContent = "拒绝";
    n.onclick = () => replyDialog({confirmed: false});
    opts.appendChild(y); opts.appendChild(n);
  } else { // input / editor / 未知
    input.classList.remove("hidden");
    input.value = o.defaultValue || o.value || "";
    input.onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault();
        replyDialog({value: input.value}); }
    };
    const b = document.createElement("button");
    b.textContent = "提交"; b.className = "primary";
    b.onclick = () => replyDialog({value: input.value});
    opts.appendChild(b);
  }
  $("dialogTimeout").textContent = o.timeout ? ("超时 " + Math.round(o.timeout / 1000) + "s 自动结算") : "";
  sysLine("⚠ dialog [" + m + "] id=" + id + " — " + trunc(o.title || "", 80), "warn");
}
async function replyDialog(fields) {
  const box = $("dialogBox");
  const id = box.dataset.did;
  if (!id) return;
  const cmd = Object.assign({type: "extension_ui_response", id: castId(id)}, fields);
  try {
    await api("cmd", {session: attached, cmd: JSON.stringify(cmd)});
    closeDialog(id, "已应答");
  } catch (e) { sysLine("dialog 应答失败: " + e.message, "err"); }
}
function castId(id) { const o = pendingDialogs[id]; return o ? o.id : id; }
function closeDialog(id, note) {
  delete pendingDialogs[id];
  if ($("dialogBox").dataset.did === String(id)) $("dialogBox").style.display = "none";
  sysLine("dialog " + id + " " + note);
  const next = Object.keys(pendingDialogs)[0];
  if (next) showDialogNow(pendingDialogs[next]);
}
function clearPendingDialogs() { pendingDialogs = {}; $("dialogBox").style.display = "none"; }

// ---------------- 上行 ----------------
async function sendCmd(cmd) {
  if (!attached) { sysLine("尚未挂接会话", "err"); return; }
  try { await api("cmd", {session: attached, cmd: JSON.stringify(cmd)}); }
  catch (e) { sysLine("发送失败: " + e.message, "err"); }
}
function sendPrompt() {
  const el = $("promptInput");
  const msg = el.value.trim();
  if (!msg) return;
  el.value = ""; el.style.height = "auto";
  sendCmd({type: "prompt", message: msg, id: uid()});
}
function sendAbort() { sendCmd({type: "abort", id: uid()}); }
function sendGetState() { sendCmd({type: "get_state", id: uid()}); }

$("promptInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
});
$("promptInput").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

// ---------------- 小工具 ----------------
function addDiv(cls, text) {
  const d = document.createElement("div");
  d.className = "ev " + cls;
  if (text) d.appendChild(document.createTextNode(text));
  $("stream").appendChild(d);
  scrollStream();
  return d;
}
function sysLine(text, cls) {
  const d = document.createElement("div");
  d.className = "ev sys" + (cls ? " " + cls : "");
  d.appendChild(document.createTextNode(new Date().toLocaleTimeString() + " " + text));
  $("stream").appendChild(d);
  scrollStream();
}
function toolLine(head, args, tail, cls) {
  const d = document.createElement("div");
  d.className = "ev tool" + (cls ? " " + cls : "");
  let s = head;
  if (args != null) s += " " + trunc(typeof args === "string" ? args : JSON.stringify(args), 160);
  if (tail) s += " " + tail;
  d.appendChild(document.createTextNode(s));
  $("stream").appendChild(d);
  scrollStream();
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;",
    ">": "&gt;", '"': "&quot;"}[c]));
}
function trunc(s, n) { s = String(s); return s.length <= n ? s : s.slice(0, n) + "…"; }
function msgText(m) {
  const c = m.content;
  if (typeof c === "string") return c;
  if (Array.isArray(c))
    return c.filter(p => p && p.type === "text").map(p => p.text || "").join("\n");
  return "";
}
function scrollStream() { const el = $("stream"); el.scrollTop = el.scrollHeight; }

// ---------------- 启动 ----------------
refreshStatus();
statusTimer = setInterval(refreshStatus, 5000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sessiond web</title>
<script type="application/javascript" src="/w/ext/markdown/deps/marked.min.js"></script>
<style>
:root {
  --bg: #ffffff; --panel: #f4f6f8; --panel2: #e9edf2; --fg: #1a1f26;
  --dim: #5a6472; --acc: #0969da; --ok: #1a7f37; --warn: #9a6700;
  --err: #cf222e; --line: #d0d7de;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5; }
header b { color: var(--acc); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
.dot.on { background: var(--ok); } .dot.err { background: var(--err); }
#connInfo { color: var(--dim); font-size: 12px; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#connInfo.flash { color: var(--warn); font-weight: 600; }
button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
button:hover { border-color: var(--acc); }
button.primary { background: var(--acc); border-color: var(--acc); color: #ffffff; }
.layout { display: flex; height: calc(100vh - 41px); }
aside { width: 300px; min-width: 220px; border-right: 1px solid var(--line);
  overflow-y: auto; background: var(--panel); }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.sess { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.sess:hover, .sess.cur { background: var(--panel2); }
.sess .name { font-weight: 600; }
.sess .meta { color: var(--dim); font-size: 12px; }
.badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px;
  border: 1px solid var(--line); color: var(--dim); margin-left: 4px; }
.badge.run { color: var(--ok); border-color: var(--ok); }
.badge.off { color: var(--dim); } .badge.dis { color: var(--err); border-color: var(--err); }
aside h3 { margin: 10px 12px 4px; font-size: 12px; color: var(--dim);
  text-transform: uppercase; letter-spacing: .08em; }
#stream { flex: 1; overflow-y: auto; padding: 12px 16px; }
.ev { margin-bottom: 8px; }
/* 用户消息靠右（聊天惯例，inform3，0829-1640-har3）：浅蓝底区分，白底主题对比度 =
   #ddf4ff 底 × #1a1f26 正文（GitHub accent 浅色系）；块右对齐、块内文本仍左起 */
.role-user { background: #ddf4ff; border: 1px solid #b6e3ff;
  border-right: 3px solid var(--acc); padding: 6px 10px; border-radius: 8px;
  white-space: pre-wrap; word-break: break-word; max-width: 80%; margin-left: auto; }
.md { word-break: break-word; }
.md p { margin: 4px 0; }
.md pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px; overflow-x: auto; font-size: 12px; }
.md code { background: var(--panel); padding: 1px 4px; border-radius: 4px;
  font-size: 12px; }
.md pre code { background: none; padding: 0; }
/* 极简内嵌语法高亮（0829-1609-8dwt 打磨项；不引外部库，取舍见 PROTOCOL §6.4） */
.md pre code .tok-k { color: #cf222e; }
.md pre code .tok-s { color: #0a3069; }
.md pre code .tok-c { color: #6e7781; font-style: italic; }
.md pre code .tok-n { color: #953800; }
/* thinking / 工具调用块默认折叠（inform4，0829-1640-har3）；状态色在 summary 可见 */
.thinking-block { margin: 2px 0; }
.thinking-block summary { color: var(--dim); font-size: 12px; cursor: pointer;
  font-style: italic; }
.thinking-block pre { white-space: pre-wrap; word-break: break-word; color: var(--dim);
  font-style: italic; font-size: 12px; margin: 4px 0; }
.sys { color: var(--dim); font-size: 12px; }
.sys.warn { color: var(--warn); } .sys.err { color: var(--err); }
.tool-block { background: var(--panel); border: 1px solid var(--line);
  border-radius: 4px; margin: 2px 0; font-size: 12px; color: var(--dim); }
.tool-block summary { cursor: pointer; padding: 4px 8px; word-break: break-all; }
.tool-block .tst { font-weight: 600; }
.tool-block.run .tst { color: var(--warn); }
.tool-block.done .tst { color: var(--ok); }
.tool-block.err .tst { color: var(--err); }
.tool-block .tbody { padding: 0 8px 6px; }
.tool-block pre { font-size: 11px; margin: 4px 0; white-space: pre-wrap;
  word-break: break-all; }
.tool-block .targs { color: var(--dim); }
.tool-block .tout { color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px;
  max-height: 300px; overflow-y: auto; }
details.raw summary { color: var(--dim); font-size: 12px; cursor: pointer; }
details.raw pre { font-size: 11px; color: var(--dim); white-space: pre-wrap;
  word-break: break-all; margin: 2px 0; }
/* 系统事件侧栏（0829-1721-56qb）：右侧可折叠，默认折叠；折叠时按钮角标计未读；
   窄屏（≤800px）改为底部叠层面板 */
#sidebar { width: 340px; min-width: 260px; border-left: 1px solid var(--line);
  overflow-y: auto; background: var(--panel); }
#sidebar h3 { margin: 10px 12px 4px; font-size: 12px; color: var(--dim);
  text-transform: uppercase; letter-spacing: .08em; }
#evtList { padding: 4px 10px 12px; }
#evtList details.raw { margin: 3px 0; padding-bottom: 3px;
  border-bottom: 1px dashed var(--line); }
#evtList details.raw.warn summary { color: var(--warn); }
#evtList details.raw.err summary { color: var(--err); }
#evtBadge { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 5px;
  border-radius: 8px; background: var(--err); color: #ffffff; font-size: 11px;
  text-align: center; vertical-align: middle; }
#evtBadge.hidden { display: none; }
@media (max-width: 800px) {
  #sidebar { position: fixed; left: 0; right: 0; bottom: 0; width: auto;
    min-width: 0; max-height: 45vh; z-index: 9; border-left: none;
    border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,.12); }
}
#inputbar { display: flex; gap: 8px; padding: 10px 16px;
  border-top: 1px solid var(--line); background: var(--panel); }
#promptInput { flex: 1; background: var(--panel2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  font: inherit; resize: none; max-height: 120px; }
#promptInput:focus { outline: none; border-color: var(--acc); }
#dialogBox { position: fixed; right: 18px; bottom: 80px; width: 380px;
  max-width: 90vw; background: var(--panel2); border: 1px solid var(--warn);
  border-radius: 10px; padding: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.15);
  display: none; z-index: 10; }
#dialogBox h4 { margin: 0 0 6px; color: var(--warn); }
#dialogTitle { white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; }
#dialogOpts { display: flex; flex-direction: column; gap: 6px; }
#dialogOpts button { text-align: left; }
#dialogInput { width: 100%; background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  margin-bottom: 8px; font: inherit; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <b>sessiond</b>
  <span class="dot" id="connDot"></span>
  <span id="connInfo">未挂接</span>
  <button id="evtToggle" onclick="toggleSide()" aria-expanded="false">系统事件 <span id="evtBadge" class="hidden">0</span></button>
  <button onclick="refreshStatus()">刷新</button>
  <button onclick="detach()">断开挂接</button>
</header>
<div class="layout">
  <aside>
    <h3>会话</h3>
    <div id="sessList"></div>
  </aside>
  <main>
    <div id="stream"></div>
    <div id="inputbar">
      <textarea id="promptInput" rows="1" placeholder="输入 prompt，Enter 发送（Shift+Enter 换行）"></textarea>
      <button onclick="sendAbort()">中止</button>
      <button class="primary" onclick="sendPrompt()">发送</button>
    </div>
  </main>
  <aside id="sidebar" class="hidden">
    <h3>系统事件</h3>
    <div id="evtList"></div>
  </aside>
</div>

<div id="dialogBox">
  <h4 id="dialogMethod">dialog</h4>
  <div id="dialogTitle"></div>
  <input id="dialogInput" class="hidden" placeholder="输入…">
  <div id="dialogOpts"></div>
  <div style="margin-top:8px; display:flex; gap:8px;">
    <button id="dialogCancel" onclick="replyDialog({cancelled:true})">取消</button>
    <span id="dialogTimeout" class="sys" style="align-self:center"></span>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const API = "/sessiond/rpc/api.py";
const STREAM = "/sessiond/rpc/stream.py";
let attached = null;          // 当前挂接会话名
let statusTimer = null;
let uidSeq = 0;
const uid = () => "web-" + (++uidSeq) + "-" + Date.now().toString(36);
let pendingDialogs = {};      // id -> request
let curAssistantEl = null;    // 当前 assistant 消息渲染节点（实时流式）
let curAssistantBuf = "";     // 累积文本（用于 message_end 时 markdown 渲染）
// 流状态（两层锚定：entries 基线 + 事件 ID 游标，任务 0829-1609-8dwt）
let streamCtrl = null;        // AbortController
let streamCursor = "";        // 最后收到的事件 ID（e<n>），续流游标
let lastEidNum = 0;           // 事件 ID 数字部分（本地连续性检查用）
let streamAlive = false;
let reconnectTimer = null;
// 基线锚定状态
let curEpoch = null;          // 守护世代（展示/调试）
let lastGen = null;           // 会话进程世代（hello/gen 变化检测）
let curLeafId = null;         // 活跃分支叶
let entryCursor = null;       // 最后 entry id（增量游标）
let seenEntryIds = new Set(); // 已渲染 entry（幂等去重）
let seenToolIds = new Set();  // 已渲染 toolCallId（entries ↔ 实时事件互斥）
let toolBlocks = {};          // toolCallId -> 折叠块引用（0829-1640-har3）
let healBusy = false;
let healFails = 0;
// 流式渐进 markdown（inform2，0829-1640-har3）：text_delta 累积后节流重渲染，
// 每次渲染都过 S2 消毒；message_end 最终收尾渲染一次。
let mdRenderTimer = null;
const MD_RENDER_MS = 150;
// 系统事件侧栏（0829-1721-56qb）：系统/控制面帧分流右侧可折叠面板，主流只留对话
let sideCollapsed = true;     // 默认折叠
let sideUnread = 0;           // 折叠期间新增条数（角标）
// dialog 倒计时
let dialogTimer = null;
let dialogDeadline = 0;

// ---------------- 基础请求 ----------------
async function api(op, extra) {
  const body = new URLSearchParams(Object.assign({op: op}, extra || {}));
  const r = await fetch(API, {method: "POST", credentials: "same-origin",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: body.toString()});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("" + r.status));
  return j;
}

// ---------------- 会话列表 ----------------
async function refreshStatus() {
  let st;
  try { st = await api("status"); } catch (e) {
    $("sessList").innerHTML = '<div class="sess"><div class="meta">status 失败: ' + esc(e.message) + "</div></div>";
    return;
  }
  const el = $("sessList");
  el.innerHTML = "";
  for (const s of (st.sessions || [])) {
    const d = document.createElement("div");
    d.className = "sess" + (s.name === attached ? " cur" : "");
    const badge = s.disabled ? '<span class="badge dis">熔断</span>'
      : s.state === "running" ? '<span class="badge run">running</span>'
      : '<span class="badge off">' + esc(s.state || "?") + "</span>";
    const en = s.enabled ? "" : '<span class="badge off">disabled</span>';
    d.innerHTML = '<div class="name">' + esc(s.name) + badge + en + "</div>"
      + '<div class="meta">gen=' + nz(s.gen) + " · restarts=" + nz(s.restarts)
      + " · clients=" + nz(s.clients) + (s.pid ? " · pid=" + s.pid : "") + "</div>";
    d.onclick = () => attach(s.name);
    el.appendChild(d);
  }
  if (!(st.sessions || []).length)
    el.innerHTML = '<div class="sess"><div class="meta">注册表为空</div></div>';
}
function nz(x) { return (x === null || x === undefined) ? "?" : x; }

// ---------------- 挂接（基线 → 记水位 → 续流） ----------------
async function attach(name) {
  if (attached === name && streamAlive) return;
  stopStream();
  clearPendingDialogs();
  $("stream").innerHTML = "";
  curAssistantEl = null; curAssistantBuf = "";
  seenEntryIds = new Set(); seenToolIds = new Set(); toolBlocks = {};
  $("evtList").innerHTML = ""; sideUnread = 0; updateBadge();   // 侧栏随挂接重置
  sysLine("挂接 " + name + "：拉取历史基线（get_entries）…");
  let doc;
  try { doc = await api("attach", {session: name}); }
  catch (e) { sysLine("挂接失败: " + e.message, "err"); return; }
  attached = name;
  applyBaseline(doc, true);
  refreshStatus();
}

// 基线落盘：渲染活跃分支、记游标/水位、开流
function applyBaseline(doc, initial) {
  curEpoch = doc.epoch !== undefined ? doc.epoch : curEpoch;
  lastGen = doc.gen !== undefined ? doc.gen : lastGen;
  curLeafId = doc.leafId || null;
  entryCursor = doc.entryCursor || null;
  const branch = activeBranch(doc.entries || [], curLeafId);
  if (!initial) {
    $("stream").innerHTML = "";
    curAssistantEl = null; curAssistantBuf = "";
    seenEntryIds = new Set(); seenToolIds = new Set(); toolBlocks = {};
  }
  for (const e of branch) renderEntry(e);
  streamCursor = doc.watermark || "";
  lastEidNum = eidNum(streamCursor);
  openStream();
  sysLine("基线 " + (doc.entries || []).length + " entries（活跃分支 "
    + branch.length + " 条" + (doc.gap ? "，缺口后全量重拉" : "") + "）"
    + (curEpoch !== null ? " · epoch=" + curEpoch : "")
    + (lastGen !== null ? " · gen=" + lastGen : ""));
}

// 活跃分支：从 leafId 沿 parentId 走回根（含 pre-compaction 链）
function activeBranch(entries, leafId) {
  if (!leafId) return [];
  const byId = {};
  for (const e of entries) if (e && e.id) byId[e.id] = e;
  const out = [];
  let cur = leafId, guard = entries.length + 1;
  while (cur && guard-- > 0) {
    const e = byId[cur];
    if (!e) break;
    out.push(e);
    cur = e.parentId;
  }
  return out.reverse();
}

// entry → 渲染（基线的持久体视图）
function renderEntry(e) {
  if (!e || !e.id || seenEntryIds.has(e.id)) return;   // 幂等
  seenEntryIds.add(e.id);
  const t = e.type;
  if (t === "message" && e.message) { renderEntryMessage(e.message); return; }
  if (t === "session_info") return;                     // 噪音，跳过
  if (t === "model_change") { sysLine("◆ model → " + (e.provider || "?") + "/" + (e.modelId || "?")); return; }
  if (t === "thinking_level_change") { sysLine("◆ thinking → " + (e.thinkingLevel || "?")); return; }
  sysLine("◆ " + (t || "?"));
}
function renderEntryMessage(m) {
  const role = m.role;
  if (role === "user") {
    const txt = msgText(m);
    if (txt) addDiv("role-user", txt);
    return;
  }
  if (role === "toolResult") {
    const key = "r:" + m.toolCallId;
    if (seenToolIds.has(key)) return;                   // 与实时事件互斥
    seenToolIds.add(key);
    let blk = m.toolCallId ? toolBlocks[m.toolCallId] : null;
    if (!blk) blk = toolBlock(m.toolCallId, m.toolName);
    blk.outPre.textContent = resultText(m);             // 并入所属工具块
    setToolStatus(blk, m.isError ? "err" : "done");
    return;
  }
  if (role === "assistant") {
    const el = addDiv("role-assistant md", "");
    let text = "";
    for (const p of m.content || []) {
      if (!p) continue;
      if (p.type === "thinking" && p.thinking) {
        el.appendChild(thinkingDetails(p.thinking));    // 默认折叠，summary 带字数
      } else if (p.type === "text") {
        text += (text ? "\n" : "") + (p.text || "");
      } else if (p.type === "toolCall") {
        if (p.id && !seenToolIds.has(p.id)) {
          seenToolIds.add(p.id);
          const blk = toolBlock(p.id, p.name);          // 折叠块；结果由 toolResult 条目并入
          blk.argsPre.textContent = fmtArgs(p.arguments);
        }
      }
    }
    renderMarkdownInto(mdDiv(el), text);                // 不擦除 thinking/工具子节点
    return;
  }
  sysLine("◆ message role=" + role);
}

// ---------------- 自愈闭环（缺口/epoch/gen 变化 → 全量基线重拉 → 新水位续流） ----------------
// 页面级策略 = 全量重渲染（清屏 + 活跃分支重建）：消息对象无稳定 id，增量
// entries 与已实时渲染的消息无法按 id 互斥，全量重渲染是无重的构造性保证；
// op=entries 增量通道（含 success:false→全量回退）由 API 层提供并验证，供其它
// 客户端与未来优化使用（见 PROTOCOL §6）。
async function heal(reason) {
  if (healBusy || !attached) return;
  healBusy = true;
  stopStream();
  flash("历史刷新中…（" + reason + "）");
  try {
    const doc = await api("attach", {session: attached});   // 全量基线（含 gap 语义）
    applyBaseline(doc, false);
    healFails = 0;
    flash("历史已刷新 ✓（" + reason + "）");
    sysLine("自愈完成（" + reason + "，全量基线重拉）");
    scrollStream();
  } catch (e) {
    healFails++;
    sysLine("自愈失败（" + reason + "）: " + e.message, "err");
    if (healFails < 5) setTimeout(() => { healBusy = false; heal(reason); }, 2000);
    else { sysLine("自愈重试超限，请手动刷新/重新挂接", "err"); healBusy = false; return; }
  }
  healBusy = false;
}

function stopStream() {
  streamAlive = false;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (streamCtrl) { try { streamCtrl.abort(); } catch (e) {} streamCtrl = null; }
  setConn(false, attached ? attached + "（流已停）" : "未挂接");
}

function openStream() {
  if (!attached) return;
  streamAlive = true;
  setConn(false, "连接中… " + attached);
  streamCtrl = new AbortController();
  const url = STREAM + "?session=" + encodeURIComponent(attached)
    + "&since=" + encodeURIComponent(streamCursor || "");
  fetch(url, {credentials: "same-origin", signal: streamCtrl.signal})
    .then(resp => {
      if (!resp.ok) throw new Error("stream " + resp.status);
      setConn(true, attached);
      const reader = resp.body.getReader();
      const dec = new TextDecoder("utf-8");
      let buf = "";
      const pump = () => reader.read().then(r => {
        if (!streamAlive) return;
        if (r.done) { throw new Error("stream ended"); }
        buf += dec.decode(r.value, {stream: true});
        buf = drainFrames(buf);
        return pump();
      });
      return pump();
    })
    .catch(e => {
      if (!streamAlive) return;           // 主动断开，不重连
      setConn(false, attached + "（重连中）");
      reconnectTimer = setTimeout(openStream, 1500);
    });
}

function eidNum(eid) {
  // eid 形如 "<bridge-ns>:<seq>"；取末段序号做本地连续性检查
  if (typeof eid !== "string") return 0;
  const i = eid.lastIndexOf(":");
  const n = parseInt(i >= 0 ? eid.slice(i + 1) : eid.replace(/^e/, ""), 10);
  return isNaN(n) ? 0 : n;
}

// 解析 SSE 帧（id:/data:），返回未消费完的剩余缓冲
function drainFrames(buf) {
  let idx;
  while ((idx = buf.indexOf("\n\n")) >= 0) {
    const frame = buf.slice(0, idx);
    buf = buf.slice(idx + 2);
    let id = null, data = null;
    for (const line of frame.split("\n")) {
      if (line.startsWith("id:")) id = line.slice(3).trim();
      else if (line.startsWith("data:")) data = line.slice(5).trim();
    }
    if (data === null) continue;          // 注释/keep-alive
    if (id !== null) {
      const n = eidNum(id);
      // 本地连续性检查（服务端之外的第二道缺口探测）
      if (n > 0 && lastEidNum > 0 && n > lastEidNum + 1) {
        // 同桥内跳号（跨桥时服务端会先发 webgw.gap 帧，此处为第二道探测）
        streamCursor = id; lastEidNum = n;
        let obj; try { obj = JSON.parse(data); } catch (e) { obj = null; }
        if (obj && obj.type !== "webgw.gap") { heal("seq 跳号 " + lastEidNum + "→" + n); return ""; }
      }
      streamCursor = id; lastEidNum = n;
    }
    let obj; try { obj = JSON.parse(data); } catch (e) { continue; }
    handleEvent(obj);
  }
  return buf;
}

function setConn(on, info) {
  $("connDot").className = "dot" + (on ? " on" : " err");
  $("connInfo").classList.remove("flash");
  $("connInfo").textContent = info;
}
function flash(info) {
  $("connInfo").textContent = info;
  $("connInfo").classList.add("flash");
  setTimeout(() => {
    $("connInfo").classList.remove("flash");
    if (attached) setConn(streamAlive, attached);
  }, 2500);
}

async function detach() {
  if (!attached) return;
  stopStream();
  try { await api("detach", {session: attached}); } catch (e) {}
  attached = null;
  entryCursor = null; streamCursor = ""; lastEidNum = 0;
  curEpoch = null; lastGen = null; curLeafId = null;
  $("stream").innerHTML = "";
  $("evtList").innerHTML = ""; sideUnread = 0; updateBadge();
  refreshStatus();
}

// ---------------- 事件渲染（实时流） ----------------
function handleEvent(o) {
  const t = o.type;
  if (t === "sessiond.hello") {
    if (curEpoch !== null && o.epoch !== undefined && o.epoch !== curEpoch) {
      curEpoch = o.epoch;
      heal("守护重启 epoch→" + o.epoch);     // 守护世代变化 → 基线自愈
      addSideEvent(o, "hello epoch→" + o.epoch + " → 基线自愈", "warn");
      return;
    }
    if (o.epoch !== undefined) curEpoch = o.epoch;
    if (o.gen !== undefined) lastGen = o.gen;
    setConn(true, o.session + " · state=" + o.state + " · gen=" + o.gen
      + " · pid=" + o.pid + (o.epoch !== undefined ? " · epoch=" + o.epoch : ""));
    addSideEvent(o, "挂接 " + o.session + "（state=" + o.state + ", gen=" + o.gen
      + ", 回放 " + (o.replay_count || 0) + " 行）");
    return;
  }
  if (t === "sessiond.replay") {
    // 实时流视角的回放：消息类事件照常渲染（与基线按游标/工具 id 去重）
    if (o.line && typeof o.line === "object") renderEvent(o.line);
    return;
  }
  if (t === "sessiond.replay_end") { addSideEvent(o, "回放结束"); return; }
  if (t === "webgw.gap") {
    addSideEvent(o, "事件流缺口（since=" + o.since + "，最旧=" + o.oldest
      + "）→ 基线自愈", "warn");
    heal("事件环淘汰");
    return;
  }
  if (t === "sessiond.error") { addSideEvent(o, "sessiond: " + o.message, "err"); return; }
  if (t === "sessiond.session_restarting") {
    addSideEvent(o, "会话进程死亡，" + (o.delay || 0) + "s 后重启", "warn"); return;
  }
  if (t === "sessiond.session_restarted") {
    addSideEvent(o, "会话已重启（gen=" + o.gen + ", pid=" + o.pid + "）", "warn");
    if (lastGen !== null && o.gen !== undefined && o.gen !== lastGen) {
      lastGen = o.gen;
      heal("会话进程重启 gen→" + o.gen);   // 会话重启 → 以 entries 为准校准
    } else if (o.gen !== undefined) lastGen = o.gen;
    return;
  }
  if (t === "sessiond.session_disabled") { addSideEvent(o, "会话崩溃熔断", "err"); return; }
  if (t === "sessiond.dialog_resolved") {
    if (pendingDialogs[o.id]) closeDialog(o.id, "已由 " + o.by + " 应答");
    return;
  }
  if (t === "sessiond.pong") { addSideEvent(o, "pong"); return; }
  if (t === "webgw.bridge_lost") {
    addSideEvent(o, "网关与会话后端断开（守护重启？）— 重连后经缺口自愈补齐", "warn");
    return;
  }
  renderEvent(o);
}

function renderEvent(o) {
  const t = o.type;
  if (classifyEvent(o) === "side") { addSideEvent(o); return; }   // 系统/控制面 → 侧栏
  if (t === "message_start") {
    const m = o.message || {};
    if (m.role === "user") {
      const txt = msgText(m);
      if (txt) addDiv("role-user", txt);
      curAssistantEl = null; curAssistantBuf = "";
    } else if (m.role === "assistant") {
      curAssistantEl = addDiv("role-assistant md", "");
      curAssistantBuf = "";
    }
    return;
  }
  if (t === "message_update") {
    const ev = o.assistantMessageEvent || {};
    if (!curAssistantEl) { curAssistantEl = addDiv("role-assistant md", ""); curAssistantBuf = ""; }
    if (ev.type === "text_delta") {
      curAssistantBuf += ev.delta || "";
      scheduleMdRender();                               // 渐进 markdown（节流，每次过消毒）
    } else if (ev.type === "thinking_delta") {
      // thinking 实时流：并入默认折叠块，summary 实时显示字数（inform4）
      let th = curAssistantEl._think;
      if (!th) {
        const d = document.createElement("details");    // 无 open = 默认折叠
        d.className = "thinking-block";
        const s = document.createElement("summary");
        const pre = document.createElement("pre");
        d.appendChild(s); d.appendChild(pre);
        curAssistantEl.insertBefore(d, curAssistantEl.firstChild);
        th = curAssistantEl._think = {sum: s, pre: pre, buf: ""};
      }
      th.buf += ev.delta || "";
      th.pre.textContent = th.buf;
      th.sum.textContent = "💭 thinking（" + th.buf.length + " 字）";
    } else if (ev.type === "toolcall_end") {
      const tc = ev.toolCall || {};
      if (tc.id) {
        if (seenToolIds.has(tc.id)) return;   // 基线已渲染（幂等）
        seenToolIds.add(tc.id);
        const blk = toolBlock(tc.id, tc.name);          // 建折叠块；start/update/end 并入
        blk.argsPre.textContent = fmtArgs(tc.arguments);
      }
    }
    scrollStream();
    return;
  }
  if (t === "message_end") {
    const m = o.message || {};
    if (mdRenderTimer) { clearTimeout(mdRenderTimer); mdRenderTimer = null; }
    if (m.role === "assistant" && curAssistantEl) {
      const txt = curAssistantBuf || msgText(m);
      renderMarkdownInto(mdDiv(curAssistantEl), txt);   // 最终收尾渲染（不擦除 thinking 折叠块）
      if (!curAssistantEl._think) {                     // 无流式 delta 的 thinking 兜底补入
        for (const p of m.content || [])
          if (p && p.type === "thinking" && p.thinking)
            curAssistantEl.insertBefore(thinkingDetails(p.thinking),
                                        curAssistantEl.firstChild);
      }
    }
    if (m.role === "assistant") {
      for (const p of m.content || [])
        if (p && p.type === "toolCall" && p.id) seenToolIds.add(p.id);
    }
    if (m.role === "toolResult" && m.toolCallId)
      seenToolIds.add("r:" + m.toolCallId);
    curAssistantEl = null; curAssistantBuf = "";
    return;
  }
  if (t === "tool_execution_start") {
    const id = o.toolCallId;
    let blk = id ? toolBlocks[id] : null;               // toolcall_end 先建过 → 复用
    if (!blk) {
      if (id && seenToolIds.has(id)) return;  // 基线已渲染（幂等）
      blk = toolBlock(id, o.toolName);
    }
    if (id) seenToolIds.add(id);
    if (!blk.argsPre.textContent) blk.argsPre.textContent = fmtArgs(o.args);
    setToolStatus(blk, "running");
    scrollStream(); return;
  }
  if (t === "tool_execution_update") {
    // 流式行并入所属工具块，不单独占行（inform4）；partialResult 是累积值 → 整段替换（pi rpc.md）
    const id = o.toolCallId;
    if (id && seenToolIds.has("r:" + id)) return;       // 基线已收尾（幂等）
    let blk = id ? toolBlocks[id] : null;
    if (!blk) blk = toolBlock(id, o.toolName);
    blk.outPre.textContent = resultText(o.partialResult);
    scrollStream(); return;
  }
  if (t === "tool_execution_end") {
    if (o.toolCallId) {
      const key = "r:" + o.toolCallId;
      if (seenToolIds.has(key)) return;       // 基线已渲染（幂等）
      seenToolIds.add(key);
    }
    let blk = o.toolCallId ? toolBlocks[o.toolCallId] : null;
    if (!blk) blk = toolBlock(o.toolCallId, o.toolName);
    blk.outPre.textContent = resultText(o.result);
    setToolStatus(blk, o.isError ? "err" : "done");
    scrollStream(); return;
  }
  if (t === "extension_ui_request") { showDialog(o); return; }
}

// ---------------- 系统事件侧栏（0829-1721-56qb） ----------------
// 分类规则：主流 = 对话（用户/助手消息、thinking、工具调用、dialog）；
// 侧栏 = 其余一切（生命周期/控制面帧、response 帧、连接提示、未知类型）。
const MAIN_EVENT_TYPES = new Set(["message_start", "message_update", "message_end",
  "tool_execution_start", "tool_execution_update", "tool_execution_end",
  "extension_ui_request"]);                                   // thinking 随 message_update 走主流
function classifyEvent(o) {
  return (o && MAIN_EVENT_TYPES.has(o.type)) ? "main" : "side";
}
// 侧栏条目一行摘要（时间戳+类型+摘要；默认只到类型名，需要时补摘要）
function sideSummary(o) {
  const t = o.type;
  if (t === "response") return "← " + (o.command || "?") + (o.success ? " ok"
    : " FAIL" + (o.error ? " — " + trunc(o.error, 200) : ""));
  if (t === "agent_end") return "agent end (willRetry=" + o.willRetry + ")";
  if (t === "queue_update") return "queue: steer=" + JSON.stringify(o.steering)
    + " followUp=" + JSON.stringify(o.followUp);
  return "";   // turn_start/turn_end/agent_start/agent_settled 等只列类型名
}
function addSideEvent(o, summaryOverride, cls) {
  const sum = (summaryOverride !== undefined) ? summaryOverride : sideSummary(o);
  addSideEntry((o.type || "?") + (sum ? " · " + sum : ""), o, cls);
}
// 通用侧栏条目：一行摘要，点击展开原始 JSON（复用 details.raw 样式）
function addSideEntry(label, rawObj, cls) {
  const d = document.createElement("details");        // 无 open = 默认折叠，点击展开
  d.className = "raw" + (cls ? " " + cls : "");

  s.textContent = new Date().toLocaleTimeString() + " " + label;
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify(rawObj, null, 1);
  d.appendChild(s); d.appendChild(pre);
  const list = $("evtList");
  list.appendChild(d);
  while (list.childElementCount > 1000) list.removeChild(list.firstElementChild);
  if (sideCollapsed) { sideUnread++; updateBadge(); }
  else {
    const sb = $("sidebar");
    sb.scrollTop = sb.scrollHeight;                   // 展开态自动跟随最新
  }
}
function toggleSide() {
  sideCollapsed = !sideCollapsed;
  $("sidebar").classList.toggle("hidden", sideCollapsed);
  $("evtToggle").setAttribute("aria-expanded", String(!sideCollapsed));

}
function updateBadge() {

    b.classList.remove("hidden");

// ---------------- thinking/工具调用折叠块（inform4，0829-1640-har3） ----------------
function thinkingDetails(text) {
  const d = document.createElement("details");          // 无 open = 默认折叠
  d.className = "thinking-block";
  const s = document.createElement("summary");
  s.textContent = "💭 thinking（" + text.length + " 字）";

// 工具调用整段（tool_execution_start→result，含其间 update 流式行）折叠为一块，
// summary 「🔧 <工具名> · running/done/err」，状态在 summary 可见。
function toolBlock(id, name) {
  if (id && toolBlocks[id]) return toolBlocks[id];
  const det = document.createElement("details");        // 默认折叠
  det.className = "ev tool-block run";
  const sum = document.createElement("summary");
  const head = document.createElement("span");
  head.textContent = "🔧 " + (name || "?") + " · ";
  const st = document.createElement("span");

  sum.appendChild(head); sum.appendChild(st);
  const body = document.createElement("div");
  body.className = "tbody";
  const argsPre = document.createElement("pre"); argsPre.className = "targs";
  const outPre = document.createElement("pre"); outPre.className = "tout";
  body.appendChild(argsPre); body.appendChild(outPre);
  det.appendChild(sum); det.appendChild(body);
  $("stream").appendChild(det);
  const blk = {det: det, st: st, argsPre: argsPre, outPre: outPre};
  if (id) toolBlocks[id] = blk;
  return blk;
}
function setToolStatus(blk, status) {
  blk.st.textContent = status;                          // running/done/err 在 summary 上
  blk.det.className = "ev tool-block "
    + (status === "done" ? "done" : status === "err" ? "err" : "run");
}
function fmtArgs(args) {
  if (args == null) return "";
  const s = typeof args === "string" ? args : JSON.stringify(args, null, 2);
  return trunc(s, 20000);
}
function resultText(res) {
  let txt = "";
  for (const c of (res && res.content) || [])
    if (c && c.type === "text") txt += c.text;
  return trunc(txt.trim(), 50000);                      // 展示截断，防巨型输出卡顿
}

// ---------------- markdown 渲染 + 极简语法高亮 ----------------
function mdDiv(el) {
  // assistant 块内的 markdown 专用子容器：innerHTML 替换不会擦除 thinking/工具子节点
  if (!el._md) {
    const d = document.createElement("div");
    d.className = "mdtext";
    el.appendChild(d);
    el._md = d;
  }
  return el._md;
}
function liveText(el, text) {
  // 备用纯文本渲染（当前未用：流式改渐进 markdown，inform2）
  if (!el._plain) { el._plain = document.createElement("div"); el.appendChild(el._plain); }
  el._plain.textContent = text;
}
function scheduleMdRender() {
  // 流式渐进渲染：150ms 节流，合并 delta 后整段重渲染（仅替换当前消息的 md 子容器，
  // 不碰其它节点；滚动锚定由 message_update 末尾的 scrollStream 保持）
  if (mdRenderTimer) return;
  mdRenderTimer = setTimeout(() => {
    mdRenderTimer = null;
    if (curAssistantEl && curAssistantBuf)
      renderMarkdownInto(mdDiv(curAssistantEl), curAssistantBuf);
  }, MD_RENDER_MS);
}
function renderMarkdownInto(el, text) {
  if (!text) return;
  if (window.marked && window.marked.parse) {
    try {
      el.innerHTML = sanitizeHtml(window.marked.parse(text));   // S2：消毒后再 innerHTML
      el.querySelectorAll("pre code").forEach(highlightCode);
      return;
    } catch (e) {}
  }
  el.textContent = text;
}

// ---------------- 极简白名单消毒（S2，0829-1640-har3） ----------------
// 取舍：w 无内置 sanitizer 且不引外部依赖（单文件零构建约束）→ 原生 DOM 解析 +
// 标签/属性/URL 三重白名单。危险容器（script/style/iframe/svg/form 控件等）连子树整体移除；
// 白名单外普通标签解包保留文本；属性只留 a[href]、img[src|alt] 且 URL 协议白名单。
// 局限：非专业消毒库（如 DOMPurify），mutation XSS 等边角面不承诺——会话内容同源可信 +
// BasicAuth 门禁下的纵深防御定位，见 PROTOCOL §6.5。
const SANITIZE_TAGS = new Set(["p", "br", "b", "i", "u", "em", "strong", "code", "pre",
  "blockquote", "ul", "ol", "li", "a", "h1", "h2", "h3", "h4", "h5", "h6",
  "table", "thead", "tbody", "tfoot", "tr", "td", "th", "img", "span", "hr",
  "del", "s", "sup", "sub", "dl", "dt", "dd", "figure", "figcaption"]);
const SANITIZE_DROP = new Set(["script", "style", "iframe", "object", "embed", "form",
  "input", "button", "textarea", "select", "option", "link", "meta", "base",
  "svg", "math", "template", "video", "audio", "source", "track", "frame",
  "frameset", "applet", "dialog"]);
function safeUrl(u) {
  if (typeof u !== "string") return false;
  const v = u.replace(/[\u0000-\u0020]+/g, "").toLowerCase();
  return /^(https?:|mailto:|#|\/|\.\/|\.\.\/)/.test(v);
}
function sanitizeWalk(parent) {
  const nodes = Array.from(parent.childNodes);
  for (const n of nodes) {
    if (n.nodeType === 8) { parent.removeChild(n); continue; }   // 注释移除（条件注释面）
    if (n.nodeType !== 1) continue;                              // 文本保留（已转义序列化）
    const tag = n.tagName.toLowerCase();
    if (SANITIZE_DROP.has(tag)) { parent.removeChild(n); continue; }
    if (!SANITIZE_TAGS.has(tag)) {
      sanitizeWalk(n);                                           // 解包：递归消毒后提升子节点
      while (n.firstChild) parent.insertBefore(n.firstChild, n);
      parent.removeChild(n);
      continue;
    }
    const attrs = Array.from(n.attributes).map(a => a.name);
    for (const a of attrs) {
      const al = a.toLowerCase();
      if (tag === "a" && al === "href" && safeUrl(n.getAttribute(a))) continue;
      if (tag === "img" && al === "src" && safeUrl(n.getAttribute(a))) continue;
      if (tag === "img" && al === "alt") continue;
      n.removeAttribute(a);                                      // 其余全删（含 on* 事件属性）
    }
    sanitizeWalk(n);
  }
}
function sanitizeHtml(html) {
  const tpl = document.createElement("template");                // 惰性文档，不执行脚本/加载资源
  tpl.innerHTML = html;
  sanitizeWalk(tpl.content);
  return tpl.innerHTML;
}
// 极简内嵌高亮：注释/字符串/数字/关键字，单一正则扫描。不引外部库（取舍：
// 无精确语法树，跨语言通用词表，满足可读性即可）。
const HL_RE = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(\d+(?:\.\d+)?)\b|\b(const|let|var|function|return|if|elif|else|for|while|class|import|from|export|async|await|try|catch|except|finally|def|pass|raise|with|as|in|of|new|typeof|instanceof|switch|case|break|continue|lambda|yield|None|True|False|null|undefined|true|false|then|do|done|fi|esac|echo|exit|local|select|struct|fn|mut|impl|use|public|private|static|void|int|str|string|bool)\b/g;
function highlightCode(codeEl) {
  const src = codeEl.textContent;
  if (!src || src.length > 200000) return;   // 超大块跳过，防卡顿
  let out = "", last = 0, m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? "tok-c" : m[2] ? "tok-s" : m[3] ? "tok-n" : "tok-k";
    out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
    last = m.index + m[0].length;
  }
  out += esc(src.slice(last));
  codeEl.innerHTML = out;
}

// ---------------- dialog 组件（倒计时实时递减，打磨项①） ----------------
function showDialog(o) {
  const id = o.id;
  pendingDialogs[id] = o;
  const box = $("dialogBox");
  if (box.style.display === "block" && box.dataset.did !== String(id)) {
    sysLine("⚠ 又一 dialog 排队 [" + (o.method || "?") + "] id=" + id, "warn");
    return;
  }
  showDialogNow(o);
}
function showDialogNow(o) {
  const id = o.id;
  const box = $("dialogBox");
  box.dataset.did = String(id);
  box.style.display = "block";
  $("dialogMethod").textContent = "dialog [" + (o.method || "?") + "] id=" + id;
  $("dialogTitle").textContent = o.title || o.message || "(无标题)";
  const opts = $("dialogOpts");
  opts.innerHTML = "";
  const input = $("dialogInput");
  const m = o.method;
  if (m === "select" && Array.isArray(o.options)) {
    input.classList.add("hidden");
    for (const op of o.options) {
      const b = document.createElement("button");
      b.textContent = op;
      b.onclick = () => replyDialog({value: op});
      opts.appendChild(b);
    }
  } else if (m === "confirm") {
    input.classList.add("hidden");
    const y = document.createElement("button");
    y.textContent = "确认"; y.className = "primary";
    y.onclick = () => replyDialog({confirmed: true});
    const n = document.createElement("button");
    n.textContent = "拒绝";
    n.onclick = () => replyDialog({confirmed: false});
    opts.appendChild(y); opts.appendChild(n);
  } else { // input / editor / 未知
    input.classList.remove("hidden");
    input.value = o.defaultValue || o.value || "";
    input.onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault();
        replyDialog({value: input.value}); }
    };
    const b = document.createElement("button");
    b.textContent = "提交"; b.className = "primary";
    b.onclick = () => replyDialog({value: input.value});
    opts.appendChild(b);
  }
  startDialogCountdown(o.timeout);
  sysLine("⚠ dialog [" + m + "] id=" + id + " — " + trunc(o.title || "", 80), "warn");
}
function startDialogCountdown(timeoutMs) {
  stopDialogCountdown();
  const el = $("dialogTimeout");
  if (!timeoutMs) { el.textContent = ""; return; }
  dialogDeadline = Date.now() + timeoutMs;
  const tick = () => {
    const remain = Math.max(0, Math.ceil((dialogDeadline - Date.now()) / 1000));
    el.textContent = "剩余 " + remain + "s 自动结算";
    if (remain <= 0) stopDialogCountdown();
  };
  tick();
  dialogTimer = setInterval(tick, 250);
}
function stopDialogCountdown() {
  if (dialogTimer) { clearInterval(dialogTimer); dialogTimer = null; }
}
async function replyDialog(fields) {
  const box = $("dialogBox");
  const id = box.dataset.did;
  if (!id) return;
  const cmd = Object.assign({type: "extension_ui_response", id: castId(id)}, fields);
  try {
    await api("cmd", {session: attached, cmd: JSON.stringify(cmd)});
    closeDialog(id, "已应答");
  } catch (e) { sysLine("dialog 应答失败: " + e.message, "err"); }
}
function castId(id) { const o = pendingDialogs[id]; return o ? o.id : id; }
function closeDialog(id, note) {
  delete pendingDialogs[id];
  if ($("dialogBox").dataset.did === String(id)) {
    $("dialogBox").style.display = "none";
    stopDialogCountdown();
    $("dialogTimeout").textContent = "";
  }
  sysLine("dialog " + id + " " + note);
  const next = Object.keys(pendingDialogs)[0];
  if (next) showDialogNow(pendingDialogs[next]);
}
function clearPendingDialogs() {
  pendingDialogs = {};
  $("dialogBox").style.display = "none";
  stopDialogCountdown();
  $("dialogTimeout").textContent = "";
}

// ---------------- 上行 ----------------
async function sendCmd(cmd) {
  if (!attached) { sysLine("尚未挂接会话", "err"); return; }
  try { await api("cmd", {session: attached, cmd: JSON.stringify(cmd)}); }
  catch (e) { sysLine("发送失败: " + e.message, "err"); }
}
function sendPrompt() {
  const el = $("promptInput");
  const msg = el.value.trim();
  if (!msg) return;
  el.value = ""; el.style.height = "auto";
  sendCmd({type: "prompt", message: msg, id: uid()});
}
function sendAbort() { sendCmd({type: "abort", id: uid()}); }

// IME 组合保护（inform2，0829-1721-56qb）：组合期间 Enter 只确认候选字，不发送；
// 部分浏览器（Chrome）compositionend 后仍会再派发一次 Enter keydown → 用标志位
// 延迟一拍清除吞掉它。
let composing = false;
$("promptInput").addEventListener("compositionstart", () => { composing = true; });
$("promptInput").addEventListener("compositionend", () => {
  setTimeout(() => { composing = false; }, 0);
});
$("promptInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    if (e.isComposing || e.keyCode === 229 || composing) return;
    e.preventDefault(); sendPrompt();
  }
});
$("promptInput").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

// ---------------- 小工具 ----------------
function addDiv(cls, text) {
  const d = document.createElement("div");
  d.className = "ev " + cls;
  if (text) d.appendChild(document.createTextNode(text));
  $("stream").appendChild(d);
  scrollStream();
  return d;
}
function sysLine(text, cls) {
  // 前端自生成的系统/控制面提示（挂接/自愈/重连/epoch 等）同样分流侧栏（0829-1721-56qb）
  addSideEntry(text, {type: "ui.note", text: text}, cls);
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;",
    ">": "&gt;", '"': "&quot;"}[c]));
}
function trunc(s, n) { s = String(s); return s.length <= n ? s : s.slice(0, n) + "…"; }
function msgText(m) {
  const c = m.content;
  if (typeof c === "string") return c;
  if (Array.isArray(c))
    return c.filter(p => p && p.type === "text").map(p => p.text || "").join("\n");
  return "";
}
function scrollStream() { const el = $("stream"); el.scrollTop = el.scrollHeight; }

// ---------------- 启动 ----------------
refreshStatus();
statusTimer = setInterval(refreshStatus, 5000);
</script>

<html>
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <head>
      <title>split frame</title>
    <link rel="stylesheet" type="text/css" href="/w/view/my.css"/>
    <style type="text/css">
    .checkbox { float: left; }
    #tab-bar { display: none; }
    #tab-bar .tab { display: inline-block; padding: 1px 6px; margin-right: 2px; border: none; font-size: 12px; color: #666; cursor: pointer; }
    #tab-bar .tab.selected { background: #dce6f2; color: #111; font-weight: bold; }
    </style>
    <script type="application/javascript" src="/w/view/my.js"></script>
    <script type="application/javascript">
      // mode is fixed per route at load time (?v=iflow → flow, ?v=itab → tab,
      // ?v=iframe → flow compat alias); no runtime flow/tab switch.
      var ARGS = (function () { try { return $QUERY_ARGS || {}; } catch (e) { return {}; } })();
      var layoutMode = (function () {
         var m = ARGS.mode;
         if (!m) {  // fallback: derive from URL when QUERY_ARGS is not substituted/parseable
             var v = new URLSearchParams(window.location.search).get('v');
             if (v == 'itab') m = 'tab';
         }
         return m == 'tab' ? 'tab' : 'flow';
      })();
      // Prefer the server-authoritative ARGS.src (original path injected by the
      // vmap view). With extension-default views (e.g. .itab → tab) re-fetching
      // location would return this view's HTML instead of the raw list, so fetch
      // the raw source via v=read (no 'read' key in vmap → falls back to the real
      // mime → raw passthrough). Fall back to stripping v= from location.
      function getUrl() {
         if (ARGS.src) {
             return ARGS.src + (ARGS.src.indexOf('?') >= 0 ? '&' : '?') + 'v=read';
         }
         return window.location.href.replace(/v=(iframe|iflow|itab)/, '');
      }
      function setIframeSrc(iframe, src) {
         if (!iframe.src.endsWith(src)) { iframe.src = src; }
         if (layoutMode == 'tab') stackFrame(iframe, true);
         else iframe.style.display = 'block';
         iframe.onload = function () { applyHeight(iframe); prewarm(iframe); }
      }
      function frameHeight(iframe) {
         var doc = iframe.contentWindow && iframe.contentWindow.document;
         if (!doc) return 0;
         var body = doc.body ? doc.body.scrollHeight : 0;
         var html = doc.documentElement ? doc.documentElement.scrollHeight : 0;
         return Math.max(body, html);
      }
      function topBarHeight() {
         var el = $('iframe-list');
         return el ? el.offsetTop : 0;
      }
      // tab mode: fill the viewport below the control/tab bar, page scrolls
      // inside (content-adaptive sizing would loop on 100vh embedded pages).
      // flow mode: keep content-adaptive height.
      function applyHeight(iframe) {
         if (layoutMode == 'tab') {
             // dvh fallback chain: vh first, then dvh (ignored by browsers
             // without dvh support; on Android Chrome dvh tracks the dynamic
             // toolbar so the iframe never exceeds the visible viewport).
             iframe.style.height = 'calc(100vh - ' + topBarHeight() + 'px)';
             iframe.style.height = 'calc(100dvh - ' + topBarHeight() + 'px)';
         } else {
             iframe.style.height = frameHeight(iframe) + 'px';
         }
      }
      // ---- 堆叠预布局（任务 8a1xdz，H1 修复）----
      // tab 模式：已加载行常驻参与布局（position:absolute 堆叠在 tab 栏下方同一位置），
      // 显隐只改 visibility/z-index——切换不再为目标文档付全量同步布局代价。
      // （display:none 的 iframe 浏览器不保有布局，切回 block 会强制该文档全量同步
      // reflow 才能上屏，大文档（如 chat）每次来回切换都卡一下。）
      // absolute 相对初始包含块（=viewport，body margin 0），top 取 iframe-list 的
      // offsetTop，与原正常流中的渲染位置一致；高度仍由 applyHeight 的 calc 语义承担。
      function stackFrame(iframe, visible) {
         iframe.style.display = 'block';
         iframe.style.position = 'absolute';
         iframe.style.left = '0';
         iframe.style.top = topBarHeight() + 'px';
         iframe.style.width = '100%';
         iframe.style.visibility = visible ? 'visible' : 'hidden';
         iframe.style.zIndex = visible ? '2' : '1';
      }
      // 预布局：强制完成一次同步布局（读布局属性即触发），代价付在加载完成时刻、
      // 而不是切换时刻；对已布局文档是廉价的。
      function prewarm(iframe) {
         if (layoutMode != 'tab') return;
         try {
             iframe.offsetWidth;
             var doc = iframe.contentWindow && iframe.contentWindow.document;
             if (doc && doc.body) doc.body.offsetHeight;
         } catch (e) { /* 跨源/未就绪：静默跳过 */ }
      }
      var items = [];        // {name, link, active, standby, standbyTimer, pendingSwap, checkbox, tab}
                             // 双缓冲（任务 24ha97）：active = 当前显示的 iframe；
                             // standby = 隐藏的预加载 iframe（加载完成后无闪换入），任一时刻每行 ≤2 个。
      var currentTab = -1;   // last selected tab index in tab layout
      // 行语法：`名字 URL [key=value ...]`（URL 后空格分隔的属性，未知键忽略，
      // 解析按可扩展写）。（历史上的 refresh=N 行属性已随周期刷新机制移除，残留无效。）
      function parseRow(s) {
         var parts = s.trim().split(/\s+/);
         var attrs = {};
         for (var i = 2; i < parts.length; i++) {
            var eq = parts[i].indexOf('=');
            if (eq > 0) attrs[parts[i].slice(0, eq)] = parts[i].slice(eq + 1);
         }
         return { name: parts[0] || '', link: parts[1] || parts[0] || '', attrs: attrs };
      }
      function reloadSrc(link) {
         return link + (link.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
      }
      // ---- 双缓冲刷新（任务 24ha97）：不再直接改可见 iframe 的 src（会白屏），
      // 而是先在隐藏 standby iframe 里加载，加载完成且内容非空白才 swap 换入。----
      // standby 就绪校验：同源可读 + readyState=complete + body 有内容/
      // scrollHeight>0，防把空白页换上来。跨源/不可读视为未就绪（不换）。
      function standbyReady(sb) {
         try {
             var doc = sb.contentWindow && sb.contentWindow.document;
             if (!doc || doc.readyState != 'complete' || !doc.body) return false;
             return doc.body.scrollHeight > 0 && doc.body.childNodes.length > 0;
         } catch (e) { return false; }
      }
      function discardStandby(it) {
         if (it.standbyTimer) { clearTimeout(it.standbyTimer); it.standbyTimer = null; }
         var sb = it.standby;
         it.standby = null;
         if (sb) {
             sb.onload = null; sb.onerror = null;
             if (sb.parentNode) sb.parentNode.removeChild(sb);
         }
      }
      function startStandby(it) {
         var sb = document.createElement('iframe');
         // tab 模式：standby 以预布局态（堆叠隐藏）挂载，加载期间渐进完成布局，
         // swap 时不再触发全量 reflow（H3）；flow 模式维持 display:none 旧行为。
         if (layoutMode == 'tab') { stackFrame(sb, false); applyHeight(sb); }
         else sb.style.display = 'none';
         $("iframe-list").appendChild(sb);
         it.standby = sb;
         // 30s 超时兜底：丢弃 standby 保留旧内容，下个周期重试（防 onload 永不触发挂死）
         it.standbyTimer = setTimeout(function () { if (it.standby === sb) discardStandby(it); }, 30000);
         sb.onerror = function () { if (it.standby === sb) discardStandby(it); }; // 加载失败：丢弃 standby 保留旧内容
         sb.onload = function () {
             if (it.standby !== sb) return; // 已被丢弃/取代的过期回调
             clearTimeout(it.standbyTimer); it.standbyTimer = null;
             if (document.hidden) { it.pendingSwap = true; return; } // 页面隐藏：推迟到可见后
             if (!standbyReady(sb)) { discardStandby(it); return; }  // 空白/未就绪：保留旧内容，下个周期重试
             prewarm(sb); // 换入前确保布局已完成，swap 只改样式不触发 reflow
             swap(it);
         };
         sb.src = reloadSrc(it.link);
      }
      // standby 换入为 active：继承旧帧显隐状态，旧帧移除（每行 DOM 中 iframe ≤2 且无泄漏）。
      function swap(it) {
         var sb = it.standby;
         if (!sb) return;
         it.standby = null;
         var old = it.active;
         sb.style.display = old.style.display;
         sb.style.visibility = old.style.visibility; // tab 模式继承显隐（flow 模式为 ''=可见，等价旧行为）
         sb.style.zIndex = old.style.zIndex;
         it.active = sb;
         old.onload = null;
         if (old.parentNode) old.parentNode.removeChild(old);
         applyHeight(sb);
      }
      function appendIndex(checklist, item, name, link) {
             var div = document.createElement('div');
             checklist.appendChild(div)
             var checkbox = document.createElement('input');
             div.appendChild(checkbox);
             div.className = 'checkbox';
             checkbox.type = 'checkbox';
             checkbox.name = name;
             checkbox.checked = true;
             // 双缓冲适配：off 隐藏 active 并取消 standby 加载；on 恢复 active（必要时重载）
             checkbox.onclick = function () {
                 if (checkbox.checked) { setIframeSrc(item.active, link); }
                 else { item.active.style.display = 'none'; discardStandby(item); }
             }
             div.appendChild(document.createTextNode(name));
             return checkbox;
      }
      function appendTab(tabbar, name, idx) {
             var tab = document.createElement('div');
             tab.className = 'tab';
             tab.appendChild(document.createTextNode(name));
             tab.onclick = function () { selectTab(idx); };
             tabbar.appendChild(tab);
             return tab;
      }
      function appendIframe(body) {
             var iframe = document.createElement('iframe');
             iframe.src = '';
             body.appendChild(iframe);
             iframe.class = 'ifr';
             iframe.style.height = '64px';
             iframe.style.display = 'none';
             return iframe;
      }
      // basename of a path (used for the browser tab title)
      function baseName(p) { var m = String(p).match(/[^/]+$/); return m ? m[0] : p; }
      function initApp(){
         setWindowTitle(baseName(ARGS.src || window.location.pathname));
         // 任务 8a1xdz：tab 列表改异步拉取（启动时的一次性同步 XHR 同样冻结主线程）
         httpAsync(getUrl(), '', function (text) { buildApp(text.split('\n')); });
      }
      function buildApp(links){
         var body = $("iframe-list");
         var checklist = $("check-list");
         var tabbar = $("tab-bar");
         for(var i in links) {
             var s = links[i];
             if (!s || s.startsWith('#')) continue;
             var row = parseRow(s);
             if (!row.name) continue; // 纯空白行跳过
             var name = row.name;
             var link = row.link;
             var iframe = appendIframe(body);
             var tab = appendTab(tabbar, name, items.length);
             var item = { name: name, link: link, active: iframe, standby: null, standbyTimer: null, pendingSwap: false, checkbox: null, tab: tab };
             item.checkbox = appendIndex(checklist, item, name, link);
             items.push(item);
             // tab mode: lazy load — hidden tabs keep an empty src and are
             // fetched only when first selected (selectTab()'s !iframeLoaded
             // branch). Flow mode still loads every row up front.
             if (layoutMode != 'tab') setIframeSrc(item.active, link);
         }
         // single-shot layout init by route mode (replaces the old runtime switch)
         if (layoutMode == 'tab') {
             checklist.style.display = 'none';
             tabbar.style.display = 'block';
             // tab mode: viewport-fill layout — no whole-page scrolling;
             // scrolling happens only inside the embedded page.
             document.body.style.overflow = 'hidden';
             // fullscreen button floats right; insert before tabs so inline tabs
             // flow into the remaining left space
             var fsBtn = document.createElement('div');
             fsBtn.id = 'fs-toggle';
             fsBtn.className = 'tab';
             fsBtn.style.cssFloat = 'right';
             fsBtn.textContent = '⛶';
             fsBtn.onclick = toggleFullscreen;
             tabbar.insertBefore(fsBtn, tabbar.firstChild);
             selectTab(currentTab >= 0 ? currentTab : 0);
         }
      }
      // 双缓冲刷新（⟳ 按钮与再点当前 tab 共用）：隐藏 standby 预加载，就绪后无白屏换入。
      // !it.standby 守卫：连点不重复启动。
      function refreshItem(it) {
         if (!it.standby) startStandby(it);
      }
      function iframeLoaded(item) {
         // indexOf (not endsWith): container-level refresh appends a ?t=<ts>
         // cache-buster to the src, so the abs URL no longer ends with the link
         return item.active.src && item.active.src.indexOf(item.link) >= 0;
      }
      function selectTab(idx) {
         var t0 = performance.now();  // 埋点（任务 8a1xdz）：切换耗时，真机 DevTools Console 可观测
         // 再点当前可见 tab = 双缓冲刷新（与 ⟳ 按钮等价）；切其他 tab 只切显示。
         // 首次选中（currentTab 初值 -1）不走此分支。
         if (idx === currentTab) {
             var cur = items[idx];
             if (cur && iframeLoaded(cur)) refreshItem(cur);
             return;
         }
         currentTab = idx;
         for (var j = 0; j < items.length; j++) {
             var it = items[j];
             if (j == idx) {
                 it.tab.className = 'tab selected';
                 if (!iframeLoaded(it)) {
                     setIframeSrc(it.active, it.link);  // lazy load; onload sets height
                 } else if (layoutMode == 'tab') {
                     stackFrame(it.active, true);   // 布局常驻，只切 visibility，无全量 reflow
                     applyHeight(it.active);
                 } else {
                     it.active.style.display = 'block';
                     applyHeight(it.active);
                 }
             } else {
                 it.tab.className = 'tab';
                 // tab 模式：已加载行只降 visibility（保持预布局）；未加载/
                 // 复选框 off（display:none）行不动，保持 lazy load 语义
                 if (layoutMode == 'tab') {
                     if (it.active.style.display != 'none') stackFrame(it.active, false);
                 } else {
                     it.active.style.display = 'none';
                 }
             }
         }
         console.debug('selectTab(' + idx + ') took ' + (performance.now() - t0).toFixed(2) + 'ms');
      }
      // flow-mode auto-fit (replaces the manual resize button): re-measure
      // visible iframes, writing height only when it actually changed
      // (avoids layout thrash on the 2s poll). Tab mode relies on the CSS
      // calc viewport-fill and needs no re-measuring.
      function refitFlow() {
         if (layoutMode != 'flow' || document.hidden) return;
         for (var j = 0; j < items.length; j++) {
             var it = items[j];
             // 只测 active（standby 隐藏且未换入，不参与布局）
             if (it.active.style.display == 'none' || !iframeLoaded(it)) continue;
             var h = frameHeight(it.active) + 'px';
             if (it.active.style.height != h) { it.active.style.height = h; }
         }
      }
      // fullscreen toggle (tab mode): Android Chrome has no browser-level
      // fullscreen switch; the only path is the Fullscreen API, which must be
      // triggered synchronously from a user gesture (no setTimeout).
      function toggleFullscreen() {
         try {
             if (document.fullscreenElement) {
                 document.exitFullscreen();
             } else {
                 var p = document.documentElement.requestFullscreen();
                 if (p && p.catch) p.catch(function () {});  // silent degrade
             }
         } catch (e) { /* unsupported browser: silent degrade */ }
      }
      document.addEventListener('fullscreenchange', function () {
         var btn = $('fs-toggle');
         if (btn) btn.textContent = document.fullscreenElement ? '✕' : '⛶';
         // dvh shifts when the status bar hides; recompute the visible iframe
         if (layoutMode == 'tab' && items[currentTab]) applyHeight(items[currentTab].active);
      });
      // window resize → embedded pages reflow → heights go stale (debounced)
      var resizeTimer = null;
      window.addEventListener('resize', function () {
         clearTimeout(resizeTimer);
         resizeTimer = setTimeout(refitFlow, 200);
      });
      // poll for async content growth (lazy load, fold/expand, late render)
      setInterval(refitFlow, 2000);
      // 页面恢复可见：执行被推迟的 swap（standby onload 时页面隐藏的情形）。
      document.addEventListener('visibilitychange', function () {
         if (document.hidden) return;
         for (var j = 0; j < items.length; j++) {
             var it = items[j];
             if (it.pendingSwap && it.standby) {
                 it.pendingSwap = false;
                 if (standbyReady(it.standby)) swap(it); else discardStandby(it);
             }
         }
      });
    </script>
  </head>
  <body onload="initApp()" style="margin:0">
   <div id="tab-bar"></div>
   <div id="check-list"></div>
   <div id="iframe-list">
  </body>
</html>
